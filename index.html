<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Speed Ball vs Golden Ratio Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 270;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_CHECKER_Y0 = TOP_ARENA_Y1 + BAR_H * 3;
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_CHECKER_Y0 = BOT_ARENA_Y1 + BAR_H * 3;
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ===== Farben (RGB-Arrays, damit Glow/Alpha einfach geht) =====
const SPD_RGB    = [255, 112, 18];   // Speed Ball - Orange
const SPD_LIGHT  = [255, 190, 110];
const SPD_DARK   = [150, 55, 0];
const SPD_HOT    = [255, 244, 176];  // weissglühend
const SPD_BOLT   = [70, 190, 255];   // elektrisches Blau
const PHI_RGB    = [214, 158, 20];   // Golden Ratio Ball - Gold
const PHI_LIGHT  = [255, 226, 128];
const PHI_DARK   = [122, 82, 0];
const PHI_TEAL   = [18, 150, 128];   // Smaragd-Akzent

function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

// 3 Balken (HP) pro Ball, der Boden ist immer der aktive Balken
const BAR_HEALTHS = [1000, 10000000000, 1000000000000000];

// Physik (identische Sprungbahn: ~1 s pro Bodenkontakt)
const GRAVITY = 0.30;
const MAX_FALL_SPEED = 30;
const BOUNCE_VY = 9.487;
const BALL_SPEED = 3.2;
const GOLDEN_ANGLE = 2.399963229728653; // Goldener Winkel (Phyllotaxis)

// Speed Ball: Schaden SPD_C * n^SPD_P, Zeitfaktor (Tempo) wächst mit jedem Treffer
const SPD_C = 120;        // Basisschaden
const SPD_P = 5;          // Exponent des Schadens
const SPD_DT0 = 0.78;      // Starttempo
const SPD_K = 0.035;       // Tempozuwachs pro Treffer (linear)
function speedDt(hits) { return SPD_DT0 * (1 + SPD_K * hits); }
function speedDamage(n) { return Math.round(SPD_C * Math.pow(n, SPD_P)); }

// Golden Ratio Ball: Schaden = phi^n
const PHI = (1 + Math.sqrt(5)) / 2;
function phiDamage(n) { return Math.round(Math.pow(PHI, n)); }

function formatNum(v) { return Math.round(v).toLocaleString('de-DE'); }

// ===== Sound =====
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function speedHitSound(n) { const t = speedDt(n); beep(110 + Math.min(n, 80) * 2, 0.12, 'sine', 0.2); beep(520 + t * 140, 0.05, 'sawtooth', 0.05); }
const PHI_NOTES = [523, 659, 784, 988, 1175, 988, 784, 659];
function phiHitSound(n) { beep(PHI_NOTES[n % PHI_NOTES.length], 0.16, 'triangle', 0.1); beep(PHI_NOTES[n % PHI_NOTES.length] * PHI / 1.0 / 2, 0.1, 'sine', 0.04); }
function breakSound() {
  if (!audioCtx) return;
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.09), i * 70));
}

// ===== Bar-Logik =====
// Original-Verhalten: ein Treffer beschädigt nur den aktuellen Balken, Überschuss verfällt
function applyDamage(bars, dmg) {
  for (let i = 0; i < bars.length; i++) {
    if (bars[i] > 0) { bars[i] -= dmg; if (bars[i] < 0) bars[i] = 0; return; }
  }
}
function isFullyDepleted(bars) { return bars.every(h => h <= 0); }
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

// ===== Effekt-System (je Seite eigene Partikel/Ringe/Flash/Shake) =====
function makeFx() { return { parts: [], rings: [], flash: 0, shake: 0, clock: 0, spiral: 0 }; }

let topBall, botBall, topBars, botBars, topHitCount, botHitCount, totalTop, totalBot;
let popups, fxTop, fxBot, started, gameOver, winner;

function fxOf(side) { return side === 'top' ? fxTop : fxBot; }
function pushPart(fx, p, cap) { if (fx.parts.length < (cap || 280)) fx.parts.push(p); }
function addPopup(side, x, y, text, color) {
  popups.push({ side, x: Math.max(44, Math.min(W - 44, x)), y, text, color, age: 0 });
}

// Fortschritt 0..1 (logarithmisch über den verursachten Gesamtschaden) -> steuert Glow-Stärke
function progressOf(total) { return Math.max(0, Math.min(1, Math.log10(total + 1) / 15)); }

function boltPoints(x, y, ang, len) {
  const pts = [[x, y]];
  const n = 5;
  let cx = x, cy = y;
  for (let i = 1; i <= n; i++) {
    const a = ang + (Math.random() - 0.5) * 1.1;
    const l = len / n;
    cx += Math.cos(a) * l; cy += Math.sin(a) * l;
    pts.push([cx, cy]);
  }
  return pts;
}

function impactFx(side, ball, n) {
  const fx = fxOf(side);
  const fy = ball.y + ball.r;
  ball.squash = 1;
  if (side === 'top') {
    // Speed: Blitze, Funken-Fächer, Überschallring
    const t = speedDt(n);
    fx.rings.push({ x: ball.x, y: fy, r: 6, grow: 3.8 + t, life: 22, c: SPD_HOT, w: 4 });
    fx.rings.push({ x: ball.x, y: fy, r: 2, grow: 2.4 + t * 0.8, life: 30, c: SPD_RGB, w: 5 });
    if (t > 1.6) fx.rings.push({ x: ball.x, y: fy, r: 4, grow: 9, life: 14, c: SPD_BOLT, w: 3, flat: true });
    const nb = Math.min(6, 2 + Math.floor(t));
    for (let i = 0; i < nb; i++) {
      const ang = -Math.PI * (0.1 + 0.8 * Math.random());
      pushPart(fx, { type: 'bolt', pts: boltPoints(ball.x, fy, ang, 38 + Math.random() * 34), x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 12, r: 2.2, c: i % 2 ? SPD_BOLT : SPD_HOT });
    }
    const cnt = 14 + Math.min(26, Math.floor(n / 3));
    for (let i = 0; i < cnt; i++) {
      const a = -Math.PI * Math.random();
      const v = 3 + Math.random() * 7.5;
      const col = Math.random() < 0.5 ? SPD_HOT : (Math.random() < 0.6 ? SPD_RGB : SPD_BOLT);
      pushPart(fx, { type: 'spark', x: ball.x, y: fy, vx: Math.cos(a) * v * 1.25, vy: Math.sin(a) * v, g: 0.2, drag: 0.982, r: 1.3 + Math.random() * 1.6, age: 0, life: 20 + Math.random() * 18, c: col });
    }
    fx.shake = Math.max(fx.shake, Math.min(6, 1 + t * 0.9));
  } else {
    // Golden Ratio: Goldener-Winkel-Burst + Ringe im Verhältnis phi
    fx.rings.push({ x: ball.x, y: fy, r: 5, grow: 3.0, life: 24, c: PHI_LIGHT, w: 3.5 });
    fx.rings.push({ x: ball.x, y: fy, r: 5 * PHI, grow: 3.0 * PHI, life: 24, c: PHI_RGB, w: 3 });
    fx.rings.push({ x: ball.x, y: fy, r: 5 * PHI * PHI, grow: 3.0 * PHI * PHI, life: 24, c: PHI_TEAL, w: 2.5 });
    const cnt = 18 + Math.min(28, Math.floor(n / 3));
    for (let i = 0; i < cnt; i++) {
      const a = i * GOLDEN_ANGLE;
      const v = 0.7 + 0.36 * Math.sqrt(i);
      let vx = Math.cos(a) * v, vy = Math.sin(a) * v;
      if (vy > 0) vy = -vy * 0.7;
      const col = i % 3 === 0 ? PHI_LIGHT : (i % 3 === 1 ? PHI_TEAL : [255, 255, 255]);
      pushPart(fx, { type: 'dot', x: ball.x, y: fy, vx, vy, g: 0.015, drag: 0.955, r: 1.8 + (i % 4) * 0.5, age: 0, life: 42 + (i % 5) * 6, c: col });
    }
    fx.shake = Math.max(fx.shake, Math.min(3.5, 0.6 + n * 0.03));
  }
}

function onBarBreak(side, idx) {
  const fx = fxOf(side);
  fx.flash = 1;
  fx.shake = Math.max(fx.shake, 9);
  const y = (side === 'top' ? TOP_ARENA_Y1 : BOT_ARENA_Y1) + idx * BAR_H + BAR_H / 2;
  const palette = side === 'top' ? [SPD_RGB, SPD_HOT, SPD_BOLT, SPD_LIGHT] : [PHI_RGB, PHI_TEAL, [255, 255, 255], PHI_LIGHT];
  for (let i = 0; i < 46; i++) {
    pushPart(fx, {
      type: 'confetti', x: 8 + Math.random() * (W - 16), y,
      vx: (Math.random() - 0.5) * 3, vy: -2.5 - Math.random() * 6.5, g: 0.22, drag: 0.99,
      r: 2.2 + Math.random() * 2.4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      age: 0, life: 60 + Math.random() * 40, c: palette[i % palette.length],
    }, 420);
  }
  fx.rings.push({ x: W / 2, y, r: 10, grow: 7, life: 22, c: palette[1], w: 5, flat: true });
  breakSound();
}

function finish(side) {
  if (gameOver) return;
  gameOver = true;
  winner = side;
  const fx = fxOf(side);
  fx.flash = 1;
  fx.shake = 10;
  const ball = side === 'top' ? topBall : botBall;
  const palette = side === 'top' ? [SPD_RGB, SPD_HOT, SPD_BOLT] : [PHI_RGB, PHI_TEAL, [255, 255, 255], PHI_LIGHT];
  for (let i = 0; i < 110; i++) {
    const a = -Math.PI * Math.random();
    const v = 2 + Math.random() * 8;
    pushPart(fx, {
      type: 'confetti', x: ball.x, y: ball.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.2, drag: 0.99,
      r: 2.4 + Math.random() * 2.6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.45,
      age: 0, life: 80 + Math.random() * 60, c: palette[i % palette.length],
    }, 520);
  }
}

function updateFx() {
  for (const fx of [fxTop, fxBot]) {
    for (let i = fx.parts.length - 1; i >= 0; i--) {
      const p = fx.parts[i];
      p.age++;
      p.x += p.vx; p.y += p.vy;
      p.vy = (p.vy + (p.g || 0)) * (p.drag || 1);
      p.vx *= (p.drag || 1);
      if (p.vr) p.rot += p.vr;
      if (p.age > p.life) fx.parts.splice(i, 1);
    }
    for (let i = fx.rings.length - 1; i >= 0; i--) {
      const r = fx.rings[i];
      r.age = (r.age || 0) + 1;
      r.r += r.grow;
      if (r.age > r.life) fx.rings.splice(i, 1);
    }
    fx.flash = Math.max(0, fx.flash - 0.06);
    fx.shake = fx.shake < 0.05 ? 0 : fx.shake * 0.87;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 44) popups.splice(i, 1);
  }
  for (const b of [topBall, botBall]) {
    if (b.squash > 0) b.squash = Math.max(0, b.squash - 0.1);
    b.trail.unshift({ x: b.x, y: b.y });
    if (b.trail.length > 16) b.trail.pop();
  }
}

// ===== Spiel =====
function init() {
  const tAngle = Math.random() * Math.PI * 2;
  topBall = {
    x: W / 2, y: TOP_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(tAngle) * BALL_SPEED, vy: Math.sin(tAngle) * BALL_SPEED,
    r: 16, dt: SPD_DT0, squash: 0, trail: [],
  };
  const bAngle = Math.random() * Math.PI * 2;
  botBall = {
    x: W / 2, y: BOT_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(bAngle) * BALL_SPEED, vy: Math.sin(bAngle) * BALL_SPEED,
    r: 16, dt: 1, squash: 0, trail: [],
  };
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  topHitCount = 0;
  botHitCount = 0;
  totalTop = 0;
  totalBot = 0;
  popups = [];
  fxTop = makeFx();
  fxBot = makeFx();
  gameOver = false;
  winner = null;
  started = false;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

// Schaden verteilen, Balkenbrüche melden; true = alle 3 Balken durchbrochen
function dealDamage(side, dmg) {
  const bars = side === 'top' ? topBars : botBars;
  const before = getActiveBarIndex(bars);
  applyDamage(bars, dmg);
  const after = getActiveBarIndex(bars);
  for (let i = before; i < after; i++) onBarBreak(side, i);
  return after >= bars.length;
}

function update() {
  if (!started) return;
  updateFx();
  if (gameOver) return;

  // ===== Oben: Speed Ball =====
  if (!isFullyDepleted(topBars)) {
    const floor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
    const x0 = 12, x1 = W - 12, y0 = TOP_ARENA_Y0 + 10, y1 = floor - 10;
    const dt = speedDt(topHitCount);
    topBall.dt = dt;
    topBall.vy += GRAVITY * dt;
    if (topBall.vy > MAX_FALL_SPEED) topBall.vy = MAX_FALL_SPEED;
    topBall.x += topBall.vx * dt;
    topBall.y += topBall.vy * dt;
    if (topBall.x - topBall.r < x0) { topBall.x = x0 + topBall.r; topBall.vx *= -1; }
    if (topBall.x + topBall.r > x1) { topBall.x = x1 - topBall.r; topBall.vx *= -1; }
    if (topBall.y - topBall.r < y0) {
      topBall.y = y0 + topBall.r; topBall.vy *= -1;
      // Deckenknall: Funken nach unten, Ring, Shake
      const cy = y0;
      fxTop.rings.push({ x: topBall.x, y: cy, r: 5, grow: 3.2, life: 18, c: SPD_BOLT, w: 3 });
      for (let i = 0; i < 12; i++) {
        const a = Math.PI * Math.random();
        const v = 2 + Math.random() * 5;
        pushPart(fxTop, { type: 'spark', x: topBall.x, y: cy, vx: Math.cos(a) * v * 1.2, vy: Math.sin(a) * v, g: 0.15, drag: 0.98, r: 1.3 + Math.random(), age: 0, life: 16 + Math.random() * 12, c: i % 2 ? SPD_HOT : SPD_BOLT });
      }
      fxTop.shake = Math.max(fxTop.shake, 3);
      topBall.squash = 0.6;
      beep(190, 0.07, 'square', 0.08);
    }
    fxTop.clock += 0.2 * dt;

    // Funkenschweif, wird mit dem Tempo dichter
    const p = progressOf(totalTop);
    if (Math.random() < 0.25 + 0.3 * dt) {
      pushPart(fxTop, {
        type: 'spark', x: topBall.x - topBall.vx * 0.5, y: topBall.y + (Math.random() - 0.5) * 10,
        vx: -topBall.vx * 0.25 + (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.8, g: 0, drag: 0.93,
        r: 1 + Math.random() * 1.2, age: 0, life: 12 + Math.random() * 10,
        c: Math.random() < 0.5 ? SPD_HOT : SPD_RGB,
      });
    }

    if (topBall.y + topBall.r > y1) {
      topBall.y = y1 - topBall.r;
      // Speed Ball springt so hoch, wie die Arena Platz hat (Arena wächst mit jedem gebrochenen Balken)
      const hMax = Math.max(60, (y1 - y0 - 2 * topBall.r) * 1.3);
      topBall.vy = -Math.sqrt(2 * GRAVITY * hMax);
      topHitCount++;
      const dmg = speedDamage(topHitCount);
      totalTop += dmg;
      addPopup('top', topBall.x, topBall.y - 8, '-' + formatNum(dmg), rgba(SPD_RGB, 1));
      impactFx('top', topBall, topHitCount);
      speedHitSound(topHitCount);
      if (dealDamage('top', dmg)) finish('top');
    }
  }

  // ===== Unten: Golden Ratio Ball (phi^n) =====
  if (!isFullyDepleted(botBars)) {
    const floor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
    const x0 = 12, x1 = W - 12, y0 = BOT_ARENA_Y0 + 10, y1 = floor - 10;
    botBall.vy += GRAVITY;
    if (botBall.vy > MAX_FALL_SPEED) botBall.vy = MAX_FALL_SPEED;
    botBall.x += botBall.vx;
    botBall.y += botBall.vy;
    if (botBall.x - botBall.r < x0) { botBall.x = x0 + botBall.r; botBall.vx *= -1; }
    if (botBall.x + botBall.r > x1) { botBall.x = x1 - botBall.r; botBall.vx *= -1; }
    if (botBall.y - botBall.r < y0) { botBall.y = y0 + botBall.r; botBall.vy *= -1; }
    fxBot.clock += 0.05;

    // Spiral-Schweif im Goldenen Winkel (Sonnenblumen-Muster)
    const p = progressOf(totalBot);
    if (Math.random() < 0.45 + 0.4 * p) {
      const a = fxBot.spiral * GOLDEN_ANGLE;
      fxBot.spiral++;
      pushPart(fxBot, {
        type: 'dot', x: botBall.x, y: botBall.y, vx: Math.cos(a) * 0.9, vy: Math.sin(a) * 0.9, g: 0, drag: 0.968,
        r: 1.3 + (fxBot.spiral % 3) * 0.5, age: 0, life: 36 + Math.random() * 14,
        c: fxBot.spiral % 3 === 0 ? PHI_LIGHT : (fxBot.spiral % 3 === 1 ? PHI_TEAL : [255, 255, 255]),
      });
    }

    if (botBall.y + botBall.r > y1) {
      botBall.y = y1 - botBall.r;
      botBall.vy = -BOUNCE_VY;
      botHitCount++;
      const dmg = phiDamage(botHitCount);
      totalBot += dmg;
      addPopup('bot', botBall.x, botBall.y - 8, '-' + formatNum(dmg), rgba(PHI_RGB, 1));
      impactFx('bot', botBall, botHitCount);
      phiHitSound(botHitCount);
      if (dealDamage('bot', dmg)) finish('bot');
    }
  }
}

// ===== Zeichnen =====
function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}

function drawHealthBar(y0, y1, light, dark, accent, health, isActive) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, rgba(light, 1));
  g.addColorStop(1, rgba(dark, 1));
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(0, y0, W, (y1 - y0) * 0.38);
  if (isActive) {
    // pulsierende Kante am Boden des aktiven Balkens
    ctx.fillStyle = rgba(accent, 0.55 + 0.35 * Math.sin(performance.now() / 160));
    ctx.fillRect(0, y0, W, 3);
  }
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  const txt = formatNum(health);
  ctx.strokeText(txt, W / 2, (y0 + y1) / 2 + 1);
  ctx.fillStyle = '#fff';
  ctx.fillText(txt, W / 2, (y0 + y1) / 2 + 1);
}

function drawBallBody(ball, rgb, light, dark, symbol) {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  // Streckung in Flugrichtung
  const sp = Math.hypot(ball.vx, ball.vy) * (ball.dt || 1);
  const st = Math.min(0.28, sp / 55);
  const ang = Math.atan2(ball.vy, ball.vx);
  ctx.rotate(ang);
  ctx.scale(1 + st, 1 / (1 + st));
  ctx.rotate(-ang);
  // Stauchung beim Aufprall (um den Bodenpunkt)
  if (ball.squash > 0) {
    ctx.translate(0, ball.r);
    ctx.scale(1 + 0.38 * ball.squash, 1 - 0.32 * ball.squash);
    ctx.translate(0, -ball.r);
  }
  const g = ctx.createRadialGradient(-ball.r * 0.35, -ball.r * 0.4, ball.r * 0.1, 0, 0, ball.r * 1.05);
  g.addColorStop(0, rgba(light, 1));
  g.addColorStop(0.55, rgba(rgb, 1));
  g.addColorStop(1, rgba(dark, 1));
  ctx.beginPath();
  ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  // Glanzpunkt
  ctx.beginPath();
  ctx.ellipse(-ball.r * 0.36, -ball.r * 0.42, ball.r * 0.26, ball.r * 0.15, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fill();
  // Emblem
  if (symbol === 'BOLT') {
    const k = ball.r / 16;
    ctx.beginPath();
    ctx.moveTo(2 * k, -11 * k); ctx.lineTo(-7 * k, 2 * k); ctx.lineTo(-1 * k, 2 * k);
    ctx.lineTo(-3 * k, 11 * k); ctx.lineTo(7 * k, -3 * k); ctx.lineTo(1 * k, -3 * k);
    ctx.closePath();
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.stroke();
    ctx.restore();
    return;
  }
  // Symbol
  ctx.font = '900 ' + Math.round(ball.r * (symbol.length > 1 ? 0.88 : 1.05)) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.strokeText(symbol, 0, 1);
  ctx.fillStyle = '#fff';
  ctx.fillText(symbol, 0, 1);
  ctx.restore();
}

function drawTrail(ball, cNear, cFar) {
  const n = ball.trail.length;
  for (let i = n - 1; i >= 1; i--) {
    const t = i / n;
    const c = [
      Math.round(cNear[0] * (1 - t) + cFar[0] * t),
      Math.round(cNear[1] * (1 - t) + cFar[1] * t),
      Math.round(cNear[2] * (1 - t) + cFar[2] * t),
    ];
    ctx.beginPath();
    ctx.arc(ball.trail[i].x, ball.trail[i].y, ball.r * (1 - t) * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = rgba(c, 0.42 * (1 - t));
    ctx.fill();
  }
}

function drawAura(ball, rgb, p) {
  const gr = ball.r * (2.2 + 1.8 * p);
  const g = ctx.createRadialGradient(ball.x, ball.y, 2, ball.x, ball.y, gr);
  g.addColorStop(0, rgba(rgb, 0.3 + 0.3 * p));
  g.addColorStop(1, rgba(rgb, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, gr, 0, Math.PI * 2);
  ctx.fill();
}

// Speed: Tempo-Glut, Speedlines, elektrische Bögen um den Ball
function drawSpeedFx(ball, clock) {
  const t = ball.dt || 1;
  const heat = Math.min(1, (t - 1) / 2.2);
  // heisser Kern, wird mit dem Tempo weissglühend
  const gr = ball.r * (1.7 + heat);
  const g = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, gr);
  g.addColorStop(0, rgba(SPD_HOT, 0.25 + 0.5 * heat));
  g.addColorStop(1, rgba(SPD_HOT, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, gr, 0, Math.PI * 2);
  ctx.fill();
  // Speedlines entgegen der Flugrichtung
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > 0.1) {
    const ux = -ball.vx / sp, uy = -ball.vy / sp;
    const nx = -uy, ny = ux;
    const cnt = Math.min(7, 2 + Math.floor(t * 1.6));
    ctx.lineCap = 'round';
    for (let i = 0; i < cnt; i++) {
      const off = (i - (cnt - 1) / 2) * 4.2 + Math.sin(clock * 3 + i * 2) * 1.2;
      const len = 10 + t * 9 + (i % 3) * 6;
      const sx = ball.x + nx * off + ux * (ball.r + 2), sy = ball.y + ny * off + uy * (ball.r + 2);
      ctx.strokeStyle = rgba(i % 2 ? SPD_HOT : SPD_RGB, 0.65);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + ux * len, sy + uy * len);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }
  // elektrische Bögen
  if (Math.random() < 0.18 + 0.3 * heat) {
    const pts = boltPoints(ball.x + Math.cos(clock) * ball.r, ball.y + Math.sin(clock) * ball.r, clock + (Math.random() - 0.5), ball.r * 1.3 + 8);
    ctx.strokeStyle = rgba(SPD_BOLT, 0.95);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
}

// Golden Ratio: rotierende goldene Spirale + Satelliten im Goldenen Winkel
function drawPhiFx(ball, clock, hits) {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  for (let arm = 0; arm < 2; arm++) {
    ctx.beginPath();
    const steps = 40;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const th = clock * 1.4 + arm * Math.PI + u * 3 * Math.PI / 2 * 2;
      const rad = ball.r * 0.95 + 24 * (Math.pow(PHI, 3 * u) - 1) / (Math.pow(PHI, 3) - 1);
      const x = Math.cos(th) * rad, y = Math.sin(th) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = rgba(arm ? PHI_TEAL : PHI_LIGHT, 0.75);
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }
  ctx.restore();
  const n = Math.min(21, 3 + Math.floor(hits / 3));
  for (let i = 0; i < n; i++) {
    const a = i * GOLDEN_ANGLE - clock * 0.8;
    const rad = ball.r + 8 + 2.4 * Math.sqrt(i);
    const x = ball.x + Math.cos(a) * rad;
    const y = ball.y + Math.sin(a) * rad;
    ctx.beginPath();
    ctx.arc(x, y, 1.3 + (i % 3) * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = i % 3 === 0 ? rgba(PHI_LIGHT, 0.95) : (i % 3 === 1 ? rgba(PHI_TEAL, 0.95) : 'rgba(255,255,255,0.95)');
    ctx.fill();
  }
}

function drawParticles(fx, confettiPass) {
  for (const p of fx.parts) {
    const isConf = p.type === 'confetti';
    if (isConf !== confettiPass) continue;
    const a = Math.max(0, 1 - p.age / p.life);
    if (p.type === 'spark') {
      ctx.strokeStyle = rgba(p.c, a);
      ctx.lineWidth = p.r;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);
      ctx.stroke();
    } else if (p.type === 'bolt') {
      ctx.strokeStyle = rgba(p.c, a);
      ctx.lineWidth = p.r * a + 0.4;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(p.pts[0][0], p.pts[0][1]);
      for (let k = 1; k < p.pts.length; k++) ctx.lineTo(p.pts[k][0], p.pts[k][1]);
      ctx.stroke();
    } else if (p.type === 'dot') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = rgba(p.c, a);
      ctx.fill();
    } else {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = rgba(p.c, Math.min(1, a * 1.6));
      ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
      ctx.restore();
    }
  }
  ctx.lineCap = 'butt';
}

function drawRings(fx) {
  for (const r of fx.rings) {
    const a = Math.max(0, 1 - (r.age || 0) / r.life);
    ctx.strokeStyle = rgba(r.c, a);
    ctx.lineWidth = r.w * a + 0.5;
    ctx.beginPath();
    if (r.flat) ctx.ellipse(r.x, r.y, r.r * 2.2, r.r * 0.22, 0, 0, Math.PI * 2);
    else ctx.ellipse(r.x, r.y, r.r, r.r * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawSide(o) {
  const fx = o.fx;
  ctx.save();
  if (fx.shake > 0) ctx.translate((Math.random() - 0.5) * fx.shake * 2, (Math.random() - 0.5) * fx.shake * 2);

  // Name
  ctx.fillStyle = rgba(o.rgb, 1);
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(o.title, W / 2, (o.labelY0 + o.labelY1) / 2);

  const active = getActiveBarIndex(o.bars);
  const floorY = o.arenaY1 + active * BAR_H;
  drawArenaBg(o.arenaY0, floorY);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, o.arenaY0, W, floorY - o.arenaY0);
  ctx.clip();

  drawRings(fx);
  drawParticles(fx, false);
  if (!isFullyDepleted(o.bars) || (gameOver && winner === o.side)) {
    drawTrail(o.ball, o.trailNear, o.trailFar);
    drawAura(o.ball, o.rgb, progressOf(o.total));
    o.drawFx();
    drawBallBody(o.ball, o.rgb, o.light, o.dark, o.symbol);
  }
  for (const p of popups) {
    if (p.side !== o.side) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 44);
    ctx.font = '900 15px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.fillStyle = '#fff';
    ctx.strokeText(p.text, p.x, p.y - p.age * 0.7);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - p.age * 0.7);
    ctx.globalAlpha = 1;
  }
  if (fx.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (fx.flash * 0.55) + ')';
    ctx.fillRect(0, o.arenaY0, W, floorY - o.arenaY0);
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = rgba(o.dark, 1);
  ctx.fillText(o.info(), 12, o.arenaY0 + 15);
  ctx.restore();

  for (let i = active; i < o.bars.length; i++) {
    const y0 = floorY + (i - active) * BAR_H;
    drawHealthBar(y0, y0 + BAR_H, o.light, o.dark, o.gold, o.bars[i], i === active);
  }
  drawChecker(o.checkerY0, o.checkerY1);

  if (gameOver && winner === o.side) {
    const y0 = o.arenaY0, y1 = o.checkerY0;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, y0, W, y1 - y0);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y0, W, y1 - y0);
    ctx.clip();
    drawParticles(fx, true);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 26px Arial';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(o.title + ' WINS', W / 2, (y0 + y1) / 2);
    ctx.fillText(o.title + ' WINS', W / 2, (y0 + y1) / 2);
  } else {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, o.arenaY0, W, floorY - o.arenaY0);
    ctx.clip();
    drawParticles(fx, true);
    ctx.restore();
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  drawSide({
    side: 'top', title: 'SPEED BALL', symbol: 'BOLT',
    rgb: SPD_RGB, light: SPD_LIGHT, dark: SPD_DARK, gold: SPD_HOT,
    trailNear: SPD_HOT, trailFar: SPD_RGB,
    ball: topBall, bars: topBars, fx: fxTop, total: totalTop,
    labelY0: TOP_LABEL_Y0, labelY1: TOP_LABEL_Y1,
    arenaY0: TOP_ARENA_Y0, arenaY1: TOP_ARENA_Y1,
    checkerY0: TOP_CHECKER_Y0, checkerY1: TOP_CHECKER_Y1,
    drawFx: () => drawSpeedFx(topBall, fxTop.clock),
    info: () => 'DAMAGE: ' + formatNum(speedDamage(topHitCount + 1)) + '  |  SPEED: ' + speedDt(topHitCount).toFixed(2) + 'x',
  });

  // VS
  ctx.fillStyle = '#111';
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  drawSide({
    side: 'bot', title: 'GOLDEN RATIO BALL', symbol: '\u03c6',
    rgb: PHI_RGB, light: PHI_LIGHT, dark: PHI_DARK, gold: PHI_TEAL,
    trailNear: PHI_LIGHT, trailFar: PHI_TEAL,
    ball: botBall, bars: botBars, fx: fxBot, total: totalBot,
    labelY0: BOT_LABEL_Y0, labelY1: BOT_LABEL_Y1,
    arenaY0: BOT_ARENA_Y0, arenaY1: BOT_ARENA_Y1,
    checkerY0: BOT_CHECKER_Y0, checkerY1: BOT_CHECKER_Y1,
    drawFx: () => drawPhiFx(botBall, fxBot.clock, botHitCount),
    info: () => 'DAMAGE: ' + formatNum(phiDamage(botHitCount + 1)),
  });
}

// Fester Zeitschritt: Videolänge unabhängig von der Bildwiederholrate (60/120 Hz)
const STEP_MS = 1000 / 60;
let lastT = 0, acc = 0;
function loop(t) {
  if (!lastT) lastT = t;
  acc += Math.min(t - lastT, 100);
  lastT = t;
  while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
