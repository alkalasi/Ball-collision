<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>10 Fibonacci Balls vs 1 Factorial Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 210;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_CHECKER_Y0 = TOP_ARENA_Y1 + BAR_H * 3;
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_CHECKER_Y0 = BOT_ARENA_Y1 + BAR_H * 3;
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ===== Farben (RGB-Arrays, damit Glow/Alpha einfach geht) =====
const KANE_RGB    = [0, 176, 190];    // Double Ball - Tuerkis
const KANE_LIGHT  = [128, 238, 242];
const KANE_DARK   = [0, 88, 100];
const KANE_GOLD   = [196, 255, 238];   // Mint-Funken
const LAM_RGB     = [31, 101, 214];   // Lamine Ball - Blau
const LAM_LIGHT   = [132, 180, 255];
const LAM_DARK    = [12, 48, 120];
const LAM_GARNET  = [216, 27, 96];    // Barca-Granat als Akzent

function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

// 3 Balken (HP) pro Ball, der Boden ist immer der aktive Balken
const BAR_HEALTHS = [1000, 10000000000, 1000000000000000];

// Physik (identische Sprungbahn: ~1 s pro Bodenkontakt)
const GRAVITY = 0.30;
const MAX_FALL_SPEED = 30;
const BOUNCE_VY = 9.487;
const BALL_SPEED = 3.2;
const GOLDEN_ANGLE = 2.399963229728653; // Goldener Winkel (Phyllotaxis)

const FIB_COUNT = 2;
function hsl2rgb(h, sat, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const f = (n) => { const k = (n + h * 12) % 12; const a = sat * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1))); };
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
const FIB_PAL = [];
FIB_PAL.push({ rgb: [140, 84, 40], light: [214, 160, 108], dark: [74, 40, 14] });   // Schokobraun
FIB_PAL.push({ rgb: [104, 118, 140], light: [176, 188, 208], dark: [48, 58, 76] });  // Schiefergrau

// Kane: "Slow Factorial" - jeder Treffer verlangsamt die Zeit weiter, dafür steigt der Schaden per Fakultät
const KANE_DT0 = 0.71;      // Zeitfaktor vor dem ersten Treffer (1 = normal)
const KANE_SLOW = 1;     // Zeitfaktor wird pro Treffer mit diesem Wert multipliziert
const KANE_MIN_DT = 0.04;  // Untergrenze, damit nichts einfriert
function kaneDt(hits) { return Math.max(KANE_MIN_DT, KANE_DT0 * Math.pow(KANE_SLOW, hits)); }

function formatNum(v) { return Math.round(v).toLocaleString('de-DE'); }

function fibonacci(n) {
  let a = 1, b = 1;
  if (n <= 2) return 1;
  for (let i = 3; i <= n; i++) { const c = a + b; a = b; b = c; }
  return b;
}
function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

// ===== Sound =====
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
const FAH_SRC = '';
const FAH_LEN = 1.0;  // nur die erste Sekunde des Sounds abspielen
let fahBuf = null, fahLoading = false;
function loadFah() {
  if (fahBuf || fahLoading || !audioCtx) return;
  fahLoading = true;
  try {
    const bin = atob(FAH_SRC.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    audioCtx.decodeAudioData(bytes.buffer, (b) => { fahBuf = b; }, () => { fahLoading = false; });
  } catch (e) { fahLoading = false; }
}
// Bei jedem Bodenkontakt des Factorial Balls: "fahhh" (WebAudio, damit es jedes Mal zuverlaessig abspielt)
function kaneHitSound(n) { beep(180 + Math.min(n, 60) * 6, 0.14, 'square', 0.07); beep(360 + Math.min(n, 60) * 12, 0.09, 'sine', 0.06); }

const FIB_NOTES = [392, 440, 494, 587, 659, 784, 880, 988, 1175, 1319];
function fibHitSound(i, n) { beep(FIB_NOTES[i % FIB_NOTES.length], 0.09, 'triangle', 0.045); }
function breakSound() {
  if (!audioCtx) return;
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.09), i * 70));
}

// ===== Bar-Logik =====
// Original-Verhalten: ein Treffer beschädigt nur den aktuellen Balken, Überschuss verfällt
function applyDamage(bars, dmg) {
  for (let i = 0; i < bars.length; i++) {
    if (bars[i] > 0) { bars[i] -= dmg; if (bars[i] < 0) bars[i] = 0; return; }
  }
}
function isFullyDepleted(bars) { return bars.every(h => h <= 0); }
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

// ===== Effekt-System (je Seite eigene Partikel/Ringe/Flash/Shake) =====
function makeFx() { return { parts: [], rings: [], flash: 0, shake: 0, clock: 0, spiral: 0 }; }

let topBall, botBalls, topBars, botBars, topHitCount, botHitCount, totalTop, totalBot;
let popups, fxTop, fxBot, started, gameOver, winner;

function fxOf(side) { return side === 'top' ? fxTop : fxBot; }
function pushPart(fx, p, cap) { if (fx.parts.length < (cap || 280)) fx.parts.push(p); }
function addPopup(side, x, y, text, color) {
  if (popups.length > 26) popups.shift();
  popups.push({ side, x: Math.max(44, Math.min(W - 44, x)), y, text, color, age: 0 });
}

// Fortschritt 0..1 (logarithmisch über den verursachten Gesamtschaden) -> steuert Glow-Stärke
function progressOf(total) { return Math.max(0, Math.min(1, Math.log10(total + 1) / 15)); }

function impactFx(side, ball, n) {
  const fx = fxOf(side);
  const fy = ball.y + ball.r;
  ball.squash = 1;
  if (side === 'top') {
    // Kane: Schockwelle + Funkenregen + Einschlaglinien
    fx.rings.push({ x: ball.x, y: fy, r: 6, grow: 3.6, life: 26, c: KANE_GOLD, w: 4 });
    fx.rings.push({ x: ball.x, y: fy, r: 2, grow: 2.2, life: 34, c: KANE_RGB, w: 5 });
    const cnt = 12 + Math.min(26, n * 2);
    for (let i = 0; i < cnt; i++) {
      const a = -Math.PI * Math.random();
      const v = 2.2 + Math.random() * 6.5;
      const col = Math.random() < 0.5 ? KANE_GOLD : (Math.random() < 0.6 ? KANE_RGB : [255, 255, 255]);
      pushPart(fx, { type: 'spark', x: ball.x, y: fy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.2, drag: 0.985, r: 1.4 + Math.random() * 1.6, age: 0, life: 26 + Math.random() * 22, c: col });
    }
    fx.shake = Math.max(fx.shake, Math.min(7, 2.2 + n * 0.3));
  } else {
    // Fibonacci-Ball: kleiner Goldener-Winkel-Burst in der Ballfarbe
    const pal = ball.pal;
    fx.rings.push({ x: ball.x, y: fy, r: 3, grow: 2.2, life: 18, c: pal.light, w: 2.2 });
    const cnt = 7 + Math.min(10, Math.floor(n / 6));
    for (let i = 0; i < cnt; i++) {
      const a = i * GOLDEN_ANGLE;
      const v = 0.6 + 0.3 * Math.sqrt(i);
      let vx = Math.cos(a) * v, vy = Math.sin(a) * v;
      if (vy > 0) vy = -vy * 0.7;
      const col = i % 3 === 0 ? pal.light : (i % 3 === 1 ? pal.rgb : [255, 255, 255]);
      pushPart(fx, { type: 'dot', x: ball.x, y: fy, vx, vy, g: 0.015, drag: 0.95, r: 1.4 + (i % 3) * 0.5, age: 0, life: 30 + (i % 5) * 5, c: col });
    }
    fx.shake = Math.max(fx.shake, Math.min(2.4, 0.4 + n * 0.02));
  }
}

function onBarBreak(side, idx) {
  const fx = fxOf(side);
  fx.flash = 1;
  fx.shake = Math.max(fx.shake, 9);
  const y = (side === 'top' ? TOP_ARENA_Y1 : BOT_ARENA_Y1) + idx * BAR_H + BAR_H / 2;
  const palette = side === 'top' ? [KANE_RGB, KANE_GOLD, [255, 255, 255], KANE_LIGHT] : FIB_PAL.map(p => p.rgb).concat([[255, 255, 255]]);
  for (let i = 0; i < 46; i++) {
    pushPart(fx, {
      type: 'confetti', x: 8 + Math.random() * (W - 16), y,
      vx: (Math.random() - 0.5) * 3, vy: -2.5 - Math.random() * 6.5, g: 0.22, drag: 0.99,
      r: 2.2 + Math.random() * 2.4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      age: 0, life: 60 + Math.random() * 40, c: palette[i % palette.length],
    }, 420);
  }
  fx.rings.push({ x: W / 2, y, r: 10, grow: 7, life: 22, c: palette[1], w: 5, flat: true });
  breakSound();
}

function finish(side) {
  if (gameOver) return;
  gameOver = true;
  winner = side;
  const fx = fxOf(side);
  fx.flash = 1;
  fx.shake = 10;
  const ball = side === 'top' ? topBall : botBalls[Math.floor(Math.random() * botBalls.length)];
  const palette = side === 'top' ? [KANE_RGB, KANE_GOLD, [255, 255, 255]] : FIB_PAL.map(p => p.rgb).concat([[255, 255, 255]]);
  for (let i = 0; i < 110; i++) {
    const a = -Math.PI * Math.random();
    const v = 2 + Math.random() * 8;
    pushPart(fx, {
      type: 'confetti', x: ball.x, y: ball.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.2, drag: 0.99,
      r: 2.4 + Math.random() * 2.6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.45,
      age: 0, life: 80 + Math.random() * 60, c: palette[i % palette.length],
    }, 520);
  }
}

function updateFx() {
  for (const fx of [fxTop, fxBot]) {
    for (let i = fx.parts.length - 1; i >= 0; i--) {
      const p = fx.parts[i];
      p.age++;
      p.x += p.vx; p.y += p.vy;
      p.vy = (p.vy + (p.g || 0)) * (p.drag || 1);
      p.vx *= (p.drag || 1);
      if (p.vr) p.rot += p.vr;
      if (p.age > p.life) fx.parts.splice(i, 1);
    }
    for (let i = fx.rings.length - 1; i >= 0; i--) {
      const r = fx.rings[i];
      r.age = (r.age || 0) + 1;
      r.r += r.grow;
      if (r.age > r.life) fx.rings.splice(i, 1);
    }
    fx.flash = Math.max(0, fx.flash - 0.06);
    fx.shake = fx.shake < 0.05 ? 0 : fx.shake * 0.87;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 44) popups.splice(i, 1);
  }
  for (const b of [topBall].concat(botBalls)) {
    if (b.squash > 0) b.squash = Math.max(0, b.squash - 0.1);
    b.trail.unshift({ x: b.x, y: b.y });
    if (b.trail.length > 16) b.trail.pop();
  }
}

// ===== Spiel =====
function init() {
  const tAngle = Math.random() * Math.PI * 2;
  topBall = {
    x: W / 2, y: TOP_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(tAngle) * BALL_SPEED, vy: Math.sin(tAngle) * BALL_SPEED,
    r: 16, dt: KANE_DT0, squash: 0, trail: [],
  };
  botBalls = [];
  for (let i = 0; i < FIB_COUNT; i++) {
    const ang = Math.random() * Math.PI * 2;
    botBalls.push({
      x: 30 + (W - 60) * (i + 0.5) / FIB_COUNT, y: BOT_ARENA_Y0 + 25 + Math.random() * 130,
      vx: Math.cos(ang) * BALL_SPEED * (0.8 + Math.random() * 0.4), vy: (Math.random() - 0.5) * 10,
      r: 15, dt: 1, squash: 0, trail: [], n: 0, id: i + 1, pal: FIB_PAL[i], clock: Math.random() * 6,
    });
  }
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  topHitCount = 0;
  botHitCount = 0;
  totalTop = 0;
  totalBot = 0;
  popups = [];
  fxTop = makeFx();
  fxBot = makeFx();
  gameOver = false;
  winner = null;
  started = false;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

// Schaden verteilen, Balkenbrüche melden; true = alle 3 Balken durchbrochen
function dealDamage(side, dmg) {
  const bars = side === 'top' ? topBars : botBars;
  const before = getActiveBarIndex(bars);
  applyDamage(bars, dmg);
  const after = getActiveBarIndex(bars);
  for (let i = before; i < after; i++) onBarBreak(side, i);
  return after >= bars.length;
}

function update() {
  if (!started) return;
  updateFx();
  if (gameOver) return;

  // ===== Oben: Kane Ball (Slow Factorial) =====
  if (!isFullyDepleted(topBars)) {
    const floor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
    const x0 = 12, x1 = W - 12, y0 = TOP_ARENA_Y0 + 10, y1 = floor - 10;
    const dt = kaneDt(topHitCount);
    topBall.dt = dt;
    topBall.vy += GRAVITY * dt;
    if (topBall.vy > MAX_FALL_SPEED) topBall.vy = MAX_FALL_SPEED;
    topBall.x += topBall.vx * dt;
    topBall.y += topBall.vy * dt;
    if (topBall.x - topBall.r < x0) { topBall.x = x0 + topBall.r; topBall.vx *= -1; }
    if (topBall.x + topBall.r > x1) { topBall.x = x1 - topBall.r; topBall.vx *= -1; }
    if (topBall.y - topBall.r < y0) { topBall.y = y0 + topBall.r; topBall.vy *= -1; }
    fxTop.clock += 0.14 * dt;

    // Glut/Funken, die vom Ball aufsteigen (bleiben im Zeitlupen-Modus länger hängen)
    const p = progressOf(totalTop);
    if (Math.random() < 0.35 + 0.5 * p) {
      pushPart(fxTop, {
        type: 'spark', x: topBall.x + (Math.random() - 0.5) * 10, y: topBall.y + (Math.random() - 0.5) * 8,
        vx: (Math.random() - 0.5) * 0.7, vy: -0.4 - Math.random() * 1.1, g: -0.004, drag: 0.99,
        r: 1 + Math.random() * 1.4, age: 0, life: 26 + Math.random() * 22,
        c: Math.random() < 0.55 ? KANE_GOLD : KANE_RGB,
      });
    }

    if (topBall.y + topBall.r > y1) {
      topBall.y = y1 - topBall.r;
      topBall.vy = -BOUNCE_VY;
      topHitCount++;
      const dmg = Math.pow(2, topHitCount - 1);
      totalTop += dmg;
      addPopup('top', topBall.x, topBall.y - 8, '-' + formatNum(dmg), rgba(KANE_RGB, 1));
      impactFx('top', topBall, topHitCount);
      kaneHitSound(topHitCount);
      if (dealDamage('top', dmg)) finish('top');
    }
  }

  // ===== Unten: 10 Fibonacci-Baelle (jeder mit eigenem Fibonacci-Zaehler) =====
  for (const b of botBalls) {
    if (isFullyDepleted(botBars)) break;
    const floor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
    const x0 = 12, x1 = W - 12, y0 = BOT_ARENA_Y0 + 10, y1 = floor - 10;
    b.vy += GRAVITY;
    if (b.vy > MAX_FALL_SPEED) b.vy = MAX_FALL_SPEED;
    b.x += b.vx;
    b.y += b.vy;
    if (b.x - b.r < x0) { b.x = x0 + b.r; b.vx *= -1; }
    if (b.x + b.r > x1) { b.x = x1 - b.r; b.vx *= -1; }
    if (b.y - b.r < y0) { b.y = y0 + b.r; b.vy *= -1; }
    b.clock += 0.05;

    if (Math.random() < 0.12) {
      const a = fxBot.spiral * GOLDEN_ANGLE;
      fxBot.spiral++;
      pushPart(fxBot, {
        type: 'dot', x: b.x, y: b.y, vx: Math.cos(a) * 0.7, vy: Math.sin(a) * 0.7, g: 0, drag: 0.968,
        r: 1.1 + (fxBot.spiral % 3) * 0.4, age: 0, life: 26 + Math.random() * 12,
        c: fxBot.spiral % 2 ? b.pal.light : [255, 255, 255],
      });
    }

    if (b.y + b.r > y1) {
      b.y = y1 - b.r;
      b.vy = -BOUNCE_VY;
      b.n++;
      botHitCount++;
      const dmg = fibonacci(b.n);
      totalBot += dmg;
      if (b.n % 3 === 0 || dmg > 1e6) addPopup('bot', b.x, b.y - 8, '-' + formatNum(dmg), rgba(b.pal.rgb, 1));
      impactFx('bot', b, b.n);
      // Fibonacci-Baelle: kein Sound
      if (dealDamage('bot', dmg)) finish('bot');
    }
  }
}

// ===== Zeichnen =====
function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}

function drawHealthBar(y0, y1, light, dark, accent, health, isActive) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, rgba(light, 1));
  g.addColorStop(1, rgba(dark, 1));
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(0, y0, W, (y1 - y0) * 0.38);
  if (isActive) {
    // pulsierende Kante am Boden des aktiven Balkens
    ctx.fillStyle = rgba(accent, 0.55 + 0.35 * Math.sin(performance.now() / 160));
    ctx.fillRect(0, y0, W, 3);
  }
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  const txt = formatNum(health);
  ctx.strokeText(txt, W / 2, (y0 + y1) / 2 + 1);
  ctx.fillStyle = '#fff';
  ctx.fillText(txt, W / 2, (y0 + y1) / 2 + 1);
}

function drawBallBody(ball, rgb, light, dark, symbol) {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  // Streckung in Flugrichtung
  const sp = Math.hypot(ball.vx, ball.vy) * (ball.dt || 1);
  const st = Math.min(0.28, sp / 55);
  const ang = Math.atan2(ball.vy, ball.vx);
  ctx.rotate(ang);
  ctx.scale(1 + st, 1 / (1 + st));
  ctx.rotate(-ang);
  // Stauchung beim Aufprall (um den Bodenpunkt)
  if (ball.squash > 0) {
    ctx.translate(0, ball.r);
    ctx.scale(1 + 0.38 * ball.squash, 1 - 0.32 * ball.squash);
    ctx.translate(0, -ball.r);
  }
  const g = ctx.createRadialGradient(-ball.r * 0.35, -ball.r * 0.4, ball.r * 0.1, 0, 0, ball.r * 1.05);
  g.addColorStop(0, rgba(light, 1));
  g.addColorStop(0.55, rgba(rgb, 1));
  g.addColorStop(1, rgba(dark, 1));
  ctx.beginPath();
  ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  // Glanzpunkt
  ctx.beginPath();
  ctx.ellipse(-ball.r * 0.36, -ball.r * 0.42, ball.r * 0.26, ball.r * 0.15, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fill();
  // Trikotnummer
  ctx.font = '900 ' + Math.round(ball.r * (symbol.length > 1 ? 0.88 : 1.05)) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.strokeText(symbol, 0, 1);
  ctx.fillStyle = '#fff';
  ctx.fillText(symbol, 0, 1);
  ctx.restore();
}

function drawTrail(ball, cNear, cFar) {
  const n = ball.trail.length;
  for (let i = n - 1; i >= 1; i--) {
    const t = i / n;
    const c = [
      Math.round(cNear[0] * (1 - t) + cFar[0] * t),
      Math.round(cNear[1] * (1 - t) + cFar[1] * t),
      Math.round(cNear[2] * (1 - t) + cFar[2] * t),
    ];
    ctx.beginPath();
    ctx.arc(ball.trail[i].x, ball.trail[i].y, ball.r * (1 - t) * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = rgba(c, 0.42 * (1 - t));
    ctx.fill();
  }
}

function drawAura(ball, rgb, p) {
  const gr = ball.r * (2.2 + 1.8 * p);
  const g = ctx.createRadialGradient(ball.x, ball.y, 2, ball.x, ball.y, gr);
  g.addColorStop(0, rgba(rgb, 0.3 + 0.3 * p));
  g.addColorStop(1, rgba(rgb, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, gr, 0, Math.PI * 2);
  ctx.fill();
}

// Kane: Zeitwarp-Ring (Zeiger + Tick-Marken, dreht sich mit dem Zeitfaktor, also immer langsamer)
function drawClockRing(ball, clock) {
  const R = ball.r + 9;
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.strokeStyle = rgba(KANE_GOLD, 0.85);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.stroke();
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R);
    ctx.lineTo(Math.cos(a) * (R + (i % 3 === 0 ? 5 : 3)), Math.sin(a) * (R + (i % 3 === 0 ? 5 : 3)));
    ctx.stroke();
  }
  ctx.strokeStyle = rgba(KANE_GOLD, 0.95);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(clock) * R, Math.sin(clock) * R);
  ctx.stroke();
  ctx.restore();
}

// Fibonacci-Ball: Satelliten im Goldenen Winkel (klein, in der Ballfarbe)
function drawSatellites(ball, hits) {
  const n = Math.min(8, 2 + Math.floor(hits / 8));
  for (let i = 0; i < n; i++) {
    const a = i * GOLDEN_ANGLE + ball.clock;
    const rad = ball.r + 4 + 2.0 * Math.sqrt(i);
    ctx.beginPath();
    ctx.arc(ball.x + Math.cos(a) * rad, ball.y + Math.sin(a) * rad, 1.0 + (i % 2) * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = i % 2 ? rgba(ball.pal.light, 0.95) : 'rgba(255,255,255,0.95)';
    ctx.fill();
  }
}

// Alle 10 Fibonacci-Baelle: Konstellations-Linien, Aura, Schweif, Satelliten
function drawFibBalls() {
  const p = progressOf(totalBot);
  const sorted = botBalls.slice().sort((a, b) => a.x - b.x);
  ctx.lineWidth = 1;
  for (let i = 0; i < sorted.length - 1; i++) {
    const a = sorted[i], b = sorted[i + 1];
    const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    g.addColorStop(0, rgba(a.pal.light, 0.28));
    g.addColorStop(1, rgba(b.pal.light, 0.28));
    ctx.strokeStyle = g;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  for (const b of botBalls) {
    drawTrail(b, b.pal.light, b.pal.rgb);
    drawAura(b, b.pal.rgb, p * 0.5);
  }
  for (const b of botBalls) {
    drawSatellites(b, b.n);
    drawBallBody(b, b.pal.rgb, b.pal.light, b.pal.dark, String(b.id));
  }
}

function drawParticles(fx, confettiPass) {
  for (const p of fx.parts) {
    const isConf = p.type === 'confetti';
    if (isConf !== confettiPass) continue;
    const a = Math.max(0, 1 - p.age / p.life);
    if (p.type === 'spark') {
      ctx.strokeStyle = rgba(p.c, a);
      ctx.lineWidth = p.r;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);
      ctx.stroke();
    } else if (p.type === 'dot') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = rgba(p.c, a);
      ctx.fill();
    } else {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = rgba(p.c, Math.min(1, a * 1.6));
      ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
      ctx.restore();
    }
  }
  ctx.lineCap = 'butt';
}

function drawRings(fx) {
  for (const r of fx.rings) {
    const a = Math.max(0, 1 - (r.age || 0) / r.life);
    ctx.strokeStyle = rgba(r.c, a);
    ctx.lineWidth = r.w * a + 0.5;
    ctx.beginPath();
    if (r.flat) ctx.ellipse(r.x, r.y, r.r * 2.2, r.r * 0.22, 0, 0, Math.PI * 2);
    else ctx.ellipse(r.x, r.y, r.r, r.r * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawSide(o) {
  const fx = o.fx;
  ctx.save();
  if (fx.shake > 0) ctx.translate((Math.random() - 0.5) * fx.shake * 2, (Math.random() - 0.5) * fx.shake * 2);

  // Name
  ctx.fillStyle = rgba(o.rgb, 1);
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(o.title, W / 2, (o.labelY0 + o.labelY1) / 2);

  const active = getActiveBarIndex(o.bars);
  const floorY = o.arenaY1 + active * BAR_H;
  drawArenaBg(o.arenaY0, floorY);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, o.arenaY0, W, floorY - o.arenaY0);
  ctx.clip();

  drawRings(fx);
  drawParticles(fx, false);
  if (!isFullyDepleted(o.bars) || (gameOver && winner === o.side)) {
    if (o.drawBalls) o.drawBalls();
    else {
      drawTrail(o.ball, o.trailNear, o.trailFar);
      drawAura(o.ball, o.rgb, progressOf(o.total));
      o.drawFx();
      drawBallBody(o.ball, o.rgb, o.light, o.dark, o.symbol);
    }
  }
  for (const p of popups) {
    if (p.side !== o.side) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 44);
    ctx.font = '900 15px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.fillStyle = '#fff';
    ctx.strokeText(p.text, p.x, p.y - p.age * 0.7);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - p.age * 0.7);
    ctx.globalAlpha = 1;
  }
  if (fx.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (fx.flash * 0.55) + ')';
    ctx.fillRect(0, o.arenaY0, W, floorY - o.arenaY0);
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = rgba(o.dark, 1);
  ctx.fillText(o.info(), 12, o.arenaY0 + 15);
  ctx.restore();

  for (let i = active; i < o.bars.length; i++) {
    const y0 = floorY + (i - active) * BAR_H;
    drawHealthBar(y0, y0 + BAR_H, o.light, o.dark, o.gold, o.bars[i], i === active);
  }
  drawChecker(o.checkerY0, o.checkerY1);

  if (gameOver && winner === o.side) {
    const y0 = o.arenaY0, y1 = o.checkerY0;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, y0, W, y1 - y0);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y0, W, y1 - y0);
    ctx.clip();
    drawParticles(fx, true);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 26px Arial';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(o.title + ' WINS', W / 2, (y0 + y1) / 2);
    ctx.fillText(o.title + ' WINS', W / 2, (y0 + y1) / 2);
  } else {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, o.arenaY0, W, floorY - o.arenaY0);
    ctx.clip();
    drawParticles(fx, true);
    ctx.restore();
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  drawSide({
    side: 'top', title: 'DOUBLE BALL', symbol: 'x2',
    rgb: KANE_RGB, light: KANE_LIGHT, dark: KANE_DARK, gold: KANE_GOLD,
    trailNear: KANE_GOLD, trailFar: KANE_RGB,
    ball: topBall, bars: topBars, fx: fxTop, total: totalTop,
    labelY0: TOP_LABEL_Y0, labelY1: TOP_LABEL_Y1,
    arenaY0: TOP_ARENA_Y0, arenaY1: TOP_ARENA_Y1,
    checkerY0: TOP_CHECKER_Y0, checkerY1: TOP_CHECKER_Y1,
    drawFx: () => drawClockRing(topBall, fxTop.clock),
    info: () => 'DAMAGE: ' + formatNum(Math.pow(2, topHitCount)),
  });

  // VS
  ctx.fillStyle = '#111';
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  drawSide({
    side: 'bot', title: 'FIBONACCI BALLS x2', symbol: '',
    rgb: [150, 92, 48], light: [224, 176, 124], dark: [78, 44, 16], gold: [140, 156, 182],
    trailNear: [255, 255, 255], trailFar: [150, 92, 48],
    ball: botBalls[0], bars: botBars, fx: fxBot, total: totalBot,
    labelY0: BOT_LABEL_Y0, labelY1: BOT_LABEL_Y1,
    arenaY0: BOT_ARENA_Y0, arenaY1: BOT_ARENA_Y1,
    checkerY0: BOT_CHECKER_Y0, checkerY1: BOT_CHECKER_Y1,
    drawBalls: drawFibBalls,
    info: () => 'DAMAGE: ' + formatNum(fibonacci(Math.round(botHitCount / FIB_COUNT) + 1)) + ' / BALL',
  });
}

// Fester Zeitschritt: Videolänge unabhängig von der Bildwiederholrate (60/120 Hz)
const STEP_MS = 1000 / 60;
let lastT = 0, acc = 0;
function loop(t) {
  if (!lastT) lastT = t;
  acc += Math.min(t - lastT, 100);
  lastT = t;
  while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
