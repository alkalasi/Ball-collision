<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Will The Bouncing Ball Escape?</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  canvas {
    display: block;
  }
  #title {
    position: relative;
    margin-top: 4%;
    color: #fff;
    font-weight: 800;
    font-size: clamp(20px, 4.5vw, 30px);
    text-align: center;
    width: 90%;
    line-height: 1.2;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  #title .accent {
    color: #4caf1e;
  }
  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #count {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-weight: 900;
    font-size: clamp(14px, 3vw, 22px);
    pointer-events: none;
  }
  #restart {
    position: relative;
    margin-top: 6%;
    background: #17b3d4;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #restart:hover { background: #12a0be; }
  #start-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 32px);
    text-align: center;
    background: rgba(0,0,0,0.75);
    padding: 16px 26px;
    border-radius: 16px;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="title">Will the bouncing ball <span class="accent">ESCAPE?</span></div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="count">400</div>
    <div id="start-overlay">Press K<br>to start</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const countEl = document.getElementById('count');

function size() {
  const reserved = 160;
  const s = Math.min(window.innerWidth * 0.92, window.innerHeight - reserved);
  canvas.width = s;
  canvas.height = s;
}
size();

const cx = canvas.width / 2;
const cy = canvas.height / 2;

const N = 50;
const VISIBLE_COUNT = 15;
const R_MIN = 40;
const R_MAX = canvas.width / 2 - 8;
const GAP_HALF_ANGLE = 0.3; // ~17° pro Seite -> ~34° Gesamtlücke
const INNER_SPEED = 0.015; // Geschwindigkeit des innersten Rings
const SPEED_STEP = 0.0006; // sehr geringer Zuwachs pro weiterem Ring nach außen
const BALL_RADIUS = 5;
const BALL_SPEED = 3.4;

// --- Sound Engine (Web Audio API) ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* Audio nicht verfügbar */ }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  if (audioCtx) {
    // Stiller Mini-Ton zum zuverlässigen Entsperren (v.a. iOS Safari)
    const unlockOsc = audioCtx.createOscillator();
    const unlockGain = audioCtx.createGain();
    unlockGain.gain.value = 0;
    unlockOsc.connect(unlockGain);
    unlockGain.connect(audioCtx.destination);
    unlockOsc.start();
    unlockOsc.stop(audioCtx.currentTime + 0.01);
  }
}

function playWallSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(450 + Math.random() * 250, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

function playEscapeSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(280, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.16);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}
// --- Ende Sound Engine ---
const GRAVITY = 0.14;

// Feste Radien der 10 sichtbaren "Slots", von innen nach außen
const slotRadius = [];
for (let k = 0; k < VISIBLE_COUNT; k++) {
  slotRadius.push(R_MIN + k * (R_MAX - R_MIN) / (VISIBLE_COUNT - 1));
}

let window_ = []; // die aktuell sichtbaren Ringe (Index 0 = innerster/aktiver Ring)
let globalDir = 1;
let remaining = N;
let ball = null;
let particles = [];

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function angleOf(x, y) {
  return Math.atan2(y - cy, x - cx);
}

function isInGap(angle, gapCenter) {
  const diff = Math.atan2(Math.sin(angle - gapCenter), Math.cos(angle - gapCenter));
  return Math.abs(diff) < GAP_HALF_ANGLE;
}

function makeRing(slotIndex, fixedGapBase) {
  return {
    radius: slotRadius[slotIndex],
    gapBase: fixedGapBase !== undefined ? fixedGapBase : Math.random() * Math.PI * 2,
    rotation: 0,
    randomFactor: 0.85 + Math.random() * 0.3,
    hue: Math.floor(Math.random() * 360),
    speedFor(idx) {
      return (INNER_SPEED + idx * SPEED_STEP) * this.randomFactor;
    }
  };
}

function buildWindow() {
  window_ = [];
  const startGapAngle = -Math.PI / 2; // alle Lücken starten auf derselben Seite
  for (let k = 0; k < VISIBLE_COUNT; k++) {
    window_.push(makeRing(k, startGapAngle));
  }
}

let started = false;

function init() {
  buildWindow();
  globalDir = 1;
  remaining = N;
  particles = [];
  started = false;
  countEl.textContent = remaining;

  const dir = Math.random() * Math.PI * 2;
  ball = {
    x: cx,
    y: cy,
    vx: Math.cos(dir) * BALL_SPEED,
    vy: Math.sin(dir) * BALL_SPEED,
    r: BALL_RADIUS,
    escaping: false
  };

  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'flex';
}
init();

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => {
  if (e.key === 'k' || e.key === 'K') startGame();
});

function spawnDisintegration(ring) {
  const segments = 40;
  const gapAngle = ring.gapBase + ring.rotation;
  for (let i = 0; i < segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    const diff = Math.atan2(Math.sin(a - gapAngle), Math.cos(a - gapAngle));
    if (Math.abs(diff) < GAP_HALF_ANGLE) continue; // Lücke selbst nicht zerfallen lassen

    const px = cx + Math.cos(a) * ring.radius;
    const py = cy + Math.sin(a) * ring.radius;
    const speed = 0.6 + Math.random() * 1.8;
    particles.push({
      x: px,
      y: py,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: 28 + Math.random() * 12,
      maxLife: 40
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.fill();
  }
}

function update() {
  if (!started) return;
  // Alle sichtbaren Ringe rotieren, je weiter außen (Slot-Index) desto schneller
  for (let i = 0; i < window_.length; i++) {
    window_[i].rotation += window_[i].speedFor(i) * globalDir;
  }

  ball.vy += GRAVITY;
  ball.x += ball.vx;
  ball.y += ball.vy;

  updateParticles();

  if (window_.length === 0) return; // alles geschafft

  const activeRing = window_[0];
  const d = dist(ball.x, ball.y, cx, cy);
  const angle = angleOf(ball.x, ball.y);
  const gapAngle = activeRing.gapBase + activeRing.rotation;

  if (d + ball.r > activeRing.radius) {
    if (ball.escaping || isInGap(angle, gapAngle)) {
      ball.escaping = true;
      if (d - ball.r > activeRing.radius + 4) {
        // innersten Ring durchbrechen -> zerfallen lassen statt einfach zu entfernen
        spawnDisintegration(activeRing);
        playEscapeSound();
        window_.shift();
        for (let i = 0; i < window_.length; i++) {
          window_[i].radius = slotRadius[i];
        }
        if (remaining > VISIBLE_COUNT) {
          window_.push(makeRing(VISIBLE_COUNT - 1));
        }
        remaining--;
        countEl.textContent = remaining;
        globalDir *= -1;
        ball.escaping = false;
      }
    } else {
      const nx = (ball.x - cx) / d;
      const ny = (ball.y - cy) / d;
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx -= 2 * dot * nx;
      ball.vy -= 2 * dot * ny;
      const overlap = d + ball.r - activeRing.radius;
      ball.x -= nx * overlap;
      ball.y -= ny * overlap;
      playWallSound();
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < window_.length; i++) {
    const ring = window_[i];
    const gapAngle = ring.gapBase + ring.rotation;
    const start = gapAngle + GAP_HALF_ANGLE;
    const end = gapAngle - GAP_HALF_ANGLE + Math.PI * 2;

    ctx.beginPath();
    ctx.arc(cx, cy, ring.radius, start, end);
    ctx.strokeStyle = (i === 0) ? '#e879f9' : `hsl(${ring.hue}, 85%, 58%)`;
    ctx.lineWidth = i === 0 ? 2.5 : 1.8;
    ctx.stroke();
  }

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#c026d3';
  ctx.fill();

  drawParticles();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.getElementById('wrap').insertAdjacentHTML('beforeend',
  '<button id="restart">Neu starten</button>');
document.getElementById('restart').addEventListener('click', init);
</script>
</body>
</html>
