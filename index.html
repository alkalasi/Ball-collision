<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ball Tournament</title>
<style>
  html, body { margin: 0; padding: 0; background: #e9ddc4; overflow: hidden; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); color: #fff; font-size: clamp(18px, 4.5vw, 26px); font-weight: 800; cursor: pointer; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.7); user-select: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480;
const LABEL_H = 36, ARENA_H = 270, BAR_H = 44, CHECKER_H = 14, VS_H = 40;
function geom(i) {
  const base = i === 0 ? 0 : (LABEL_H + ARENA_H + BAR_H * 3 + CHECKER_H + VS_H);
  const g = { labelY0: base, labelY1: base + LABEL_H };
  g.arenaY0 = g.labelY1; g.arenaY1 = g.arenaY0 + ARENA_H;
  g.checkerY0 = g.arenaY1 + BAR_H * 3; g.checkerY1 = g.checkerY0 + CHECKER_H;
  return g;
}
const G = [geom(0), geom(1)];
const VS_Y0 = G[0].checkerY1, VS_Y1 = VS_Y0 + VS_H;
const H = G[1].checkerY1;
canvas.width = W; canvas.height = H;
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px'; canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize); resize();

function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function formatNum(v) { return Math.round(v).toLocaleString('de-DE'); }
let rs = 20261028;
function rnd() { rs = (Math.imul(rs, 1664525) + 1013904223) >>> 0; return rs / 4294967296; }
const ease = (t) => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);

// ===== Physik =====
const GRAVITY = 0.30, MAX_FALL_SPEED = 30, BOUNCE_VY = 9.487, BALL_SPEED = 3.2;
const GOLDEN_ANGLE = 2.399963229728653, PHI = (1 + Math.sqrt(5)) / 2;
const BAR_HEALTHS = [1000, 10000000000, 1000000000000000];
const TS = 1, TF = 1.45, TM = {};

// ===== Sound =====
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function breakSound() { if (!audioCtx) return; [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.09), i * 70)); }
const NOTES = [523, 659, 784, 988, 1175, 988, 784, 659];

// ===== Zahlenfolgen =====
function fibN(n) { let a = 1, b = 1; for (let i = 2; i < n; i++) { const t = a + b; a = b; b = t; } return n <= 2 ? 1 : b; }
function facN(n) { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; }

// ===== Ball-Typen =====
const GROW_R0 = 14, GROW_RK = 3.0, GROW_RMAX = 170, GROW_CEIL_R = 48;
const ORB_R = 40, ORB_SR = 6, ORB_W = 0.075, ORB_F = 0.25, ORB_MAX = 14;
const SPLIT_GAP = 150, SPLIT_MAX = 16;
const RK_GAP = 80, RK_FLIGHT = 30, RK_F = 40;
function growR(n) { return Math.min(GROW_RMAX, GROW_R0 + GROW_RK * n); }

const SPECS = {
  speed: { key: 'speed', title: 'SPEED BALL', symbol: 'BOLT', rgb: [255, 112, 18], light: [255, 190, 110], dark: [150, 55, 0], hot: [255, 244, 176], acc: [70, 190, 255], r0: 16,
    dmg: n => Math.pow(n, 4), dt: sd => 0.72 * (1 + 0.035 * sd.hits), jump: (sd, y0, y1, b) => -Math.sqrt(2 * GRAVITY * Math.max(60, (y1 - y0 - 2 * b.r) * 1.3)),
    info: sd => 'SPEED: ' + (0.72 * (1 + 0.035 * sd.hits)).toFixed(2) + 'x' },
  double: { key: 'double', title: 'DOUBLE BALL', symbol: 'x2', rgb: [30, 100, 235], light: [150, 195, 255], dark: [8, 38, 140], hot: [190, 225, 255], acc: [70, 200, 255], r0: 16,
    dmg: n => Math.pow(2, n - 1), dt: sd => 0.71, info: sd => 'x2 EVERY HIT' },
  grow: { key: 'grow', title: 'GROW BALL', symbol: 'ARROW', rgb: [255, 238, 0], light: [255, 250, 150], dark: [145, 125, 0], hot: [255, 255, 190], acc: [190, 255, 40], r0: GROW_R0,
    dmg: n => Math.pow(n, 3), dt: sd => 0.54,
    jump: (sd, y0, y1, b) => -Math.sqrt(2 * GRAVITY * Math.max(50, (y1 - y0 - 2 * b.r) * (b.r >= GROW_CEIL_R ? 1.15 : 0.96))),
    onHit: (sd, b, n) => { b.r = growR(n); }, info: sd => 'SIZE: ' + sd.ball.r.toFixed(0) + ' px' },
  gravity: { key: 'gravity', title: 'GRAVITY BALL', symbol: 'G', rgb: [92, 64, 214], light: [170, 160, 255], dark: [28, 16, 100], hot: [215, 205, 255], acc: [235, 70, 255], r0: 16,
    dmg: n => Math.pow(n, 3), dt: sd => 0.8, gm: sd => 1 + 0.03 * sd.hits, info: sd => 'GRAVITY: ' + (1 + 0.03 * sd.hits).toFixed(2) + 'g' },
  fib: { key: 'fib', title: 'FIBONACCI BALL', symbol: 'F', rgb: [224, 23, 46], light: [255, 150, 150], dark: [110, 4, 16], hot: [255, 200, 190], acc: [255, 205, 40], r0: 16,
    dmg: n => fibN(n), dt: sd => 0.75, info: sd => 'NEXT: ' + formatNum(fibN(sd.hits + 1)) + 'x' },
  fact: { key: 'fact', title: 'FACTORIAL BALL', symbol: '!', rgb: [16, 168, 128], light: [140, 240, 205], dark: [0, 84, 62], hot: [200, 255, 235], acc: [255, 196, 40], r0: 17,
    dmg: n => facN(n), dt: sd => 0.5, info: sd => 'NEXT: ' + (sd.hits + 1) + '!' },
  orbital: { key: 'orbital', title: 'ORBITAL BALL', symbol: 'ORBIT', rgb: [40, 200, 235], light: [170, 240, 255], dark: [6, 90, 120], hot: [225, 255, 255], acc: [255, 214, 90], r0: 16,
    dmg: n => Math.pow(n, 3), dt: sd => 0.8, jump: (sd, y0, y1, b) => -Math.sqrt(2 * GRAVITY * Math.max(40, (y1 - y0 - 2 * b.r) * 0.8)),
    info: sd => 'ORBITS: ' + sd.sats.length },
  split: { key: 'split', title: 'SPLIT BALL', symbol: '÷', rgb: [236, 72, 153], light: [255, 170, 215], dark: [120, 10, 70], hot: [255, 215, 235], acc: [255, 255, 255], r0: 16,
    dmg: n => Math.pow(n, 2), dt: sd => 0.6, info: sd => 'BALLS: ' + (sd.clones.length + 1) },
};

function mkSpec(key, title, symbol, rgb, light, dark, hot, acc) {
  return { key, title, symbol, rgb, light, dark, hot, acc, r0: 16, dmg: n => n * n, dt: sd => 0.7, info: sd => '', todo: true };
}
SPECS.rocket = { key: 'rocket', title: 'ROCKET BALL', symbol: 'ROCKET', rgb: [238, 58, 58], light: [255, 170, 160], dark: [120, 10, 20], hot: [255, 225, 190], acc: [255, 190, 50], r0: 16,
  dmg: n => n * n, dt: sd => 0.7, info: sd => 'ROCKETS: ' + sd.rk };
SPECS.freeze = mkSpec('freeze', 'FREEZE BALL', 'SNOW', [110, 185, 245], [205, 238, 255], [30, 80, 150], [235, 250, 255], [255, 255, 255]);
SPECS.inferno = mkSpec('inferno', 'INFERNO BALL', 'FLAME', [190, 28, 18], [255, 140, 70], [70, 0, 0], [255, 210, 120], [255, 150, 30]);
SPECS.laser = mkSpec('laser', 'LASER BALL', 'LASER', [24, 205, 90], [150, 255, 190], [0, 92, 40], [220, 255, 235], [255, 60, 60]);
SPECS.golden = mkSpec('golden', 'GOLDEN RATIO BALL', 'φ', [214, 160, 20], [255, 225, 120], [110, 70, 0], [255, 240, 180], [255, 255, 255]);
SPECS.drill = mkSpec('drill', 'DRILL BALL', 'DRILL', [118, 126, 140], [200, 208, 222], [46, 52, 66], [235, 240, 250], [255, 150, 30]);
SPECS.vampire = mkSpec('vampire', 'VAMPIRE BALL', 'FANG', [150, 18, 85], [235, 110, 170], [60, 0, 32], [255, 190, 220], [255, 40, 60]);
SPECS.lightning = mkSpec('lightning', 'LIGHTNING BALL', 'ZAP', [38, 44, 96], [120, 130, 220], [8, 10, 40], [190, 200, 255], [255, 235, 70]);
SPECS.sticky = mkSpec('sticky', 'STICKY BALL', 'GLUE', [162, 106, 46], [235, 190, 120], [80, 44, 8], [255, 225, 175], [140, 230, 60]);
SPECS.bomb = mkSpec('bomb', 'BOMB BALL', 'BOMB', [64, 70, 78], [150, 158, 170], [14, 16, 20], [220, 225, 235], [255, 150, 30]);

// ===== Zustand eines Duells =====
let S = [null, null];          // S[0] oben, S[1] unten
let popups = [];
let duel = null;               // { over, winner }
function makeFx() { return { parts: [], rings: [], flash: 0, shake: 0, clock: 0, spiral: 0 }; }
function pushPart(fx, p, cap) { if (fx.parts.length < (cap || 260)) fx.parts.push(p); }
function addPopup(i, x, y, text, color) { popups.push({ i, x: Math.max(44, Math.min(W - 44, x)), y, text, color, age: 0 }); }
function applyDamage(bars, dmg) { for (let i = 0; i < bars.length; i++) { if (bars[i] > 0) { bars[i] -= dmg; if (bars[i] < 0) bars[i] = 0; return; } } }
function isDepleted(bars) { return bars.every(h => h <= 0); }
function activeBar(bars) { for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i; return bars.length; }
function progressOf(total) { return Math.max(0, Math.min(1, Math.log10(total + 1) / 15)); }

function newSide(i, key, C, seed) {
  const spec = SPECS[key];
  let rs2 = (seed || 1) >>> 0;
  const rn = () => { rs2 = (Math.imul(rs2, 1664525) + 1013904223) >>> 0; return rs2 / 4294967296; };
  const a = rn() * Math.PI * 2;
  const sd = {
    rnd: rn, i, key, spec, C, hits: 0, total: 0, fx: makeFx(), bars: BAR_HEALTHS.slice(), clones: [], sats: [], splitTimer: 0, fin: -1, rkT: 0, rk: 0, rockets: [],
    ball: { x: W / 2, y: G[i].arenaY0 + ARENA_H / 2, vx: Math.cos(a) * BALL_SPEED, vy: Math.sin(a) * BALL_SPEED, r: spec.r0, dt: 1, squash: 0, trail: [] },
  };
  if (key === 'orbital') addSat(sd, true);
  return sd;
}
function addSat(sd, first) {
  if (sd.sats.length >= ORB_MAX) return;
  const i = sd.sats.length;
  const a0 = sd.sats.length ? sd.sats[0].a : sd.rnd() * 6.28;
  sd.sats.push({ a: a0 + i * GOLDEN_ANGLE, armed: true, x: sd.ball.x, y: sd.ball.y, R: ORB_R + 12 * Math.floor(i / 7), born: 0 });
  if (!first) {
    sd.fx.rings.push({ x: sd.ball.x, y: sd.ball.y, r: 6, grow: 3.2, life: 18, c: sd.spec.acc, w: 3, round: true });
    addPopup(sd.i, sd.ball.x, sd.ball.y - 28, '+1 ORBIT', rgba(sd.spec.acc, 1));
    beep(1046 + i * 30, 0.08, 'triangle', 0.07);
  }
}

function onBarBreak(sd, idx) {
  const fx = sd.fx, sp = sd.spec;
  fx.flash = 1; fx.shake = Math.max(fx.shake, 9);
  const y = G[sd.i].arenaY1 + idx * BAR_H + BAR_H / 2;
  const pal = [sp.rgb, sp.hot, sp.acc, sp.light];
  for (let i = 0; i < 40; i++) pushPart(fx, { type: 'confetti', x: 8 + Math.random() * (W - 16), y, vx: (Math.random() - 0.5) * 3, vy: -2.5 - Math.random() * 6.5, g: 0.22, drag: 0.99, r: 2.2 + Math.random() * 2.4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, age: 0, life: 60 + Math.random() * 40, c: pal[i % pal.length] }, 400);
  fx.rings.push({ x: W / 2, y, r: 10, grow: 7, life: 22, c: sp.hot, w: 5, flat: true });
  breakSound();
}
function finishSide(sd) {
  if (sd.fin >= 0) return;
  sd.fin = 1;
  if (duel && !duel.over) {
    duel.over = true; duel.winner = sd.i; duel.t = 0;
    const fx = sd.fx; fx.flash = 1; fx.shake = 10;
    const pal = [sd.spec.rgb, sd.spec.hot, sd.spec.acc, sd.spec.light];
    for (let i = 0; i < 100; i++) {
      const a = -Math.PI * Math.random(), v = 2 + Math.random() * 8;
      pushPart(fx, { type: 'confetti', x: sd.ball.x, y: sd.ball.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.2, drag: 0.99, r: 2.4 + Math.random() * 2.6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.45, age: 0, life: 80 + Math.random() * 60, c: pal[i % pal.length] }, 500);
    }
  }
}
function dealDamage(sd, dmg) {
  const before = activeBar(sd.bars);
  applyDamage(sd.bars, dmg);
  const after = activeBar(sd.bars);
  for (let i = before; i < after; i++) onBarBreak(sd, i);
  if (after >= sd.bars.length) finishSide(sd);
}

// ===== Treffer-Effekte je Ball-Typ =====
function boltPoints(x, y, ang, len) {
  const pts = [[x, y]]; let cx = x, cy = y;
  for (let i = 1; i <= 5; i++) { const a = ang + (Math.random() - 0.5) * 1.1; cx += Math.cos(a) * len / 5; cy += Math.sin(a) * len / 5; pts.push([cx, cy]); }
  return pts;
}
function sparks(fx, x, y, n, vmin, vmax, cols, g) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * Math.random(), v = vmin + Math.random() * (vmax - vmin);
    pushPart(fx, { type: 'spark', x, y, vx: Math.cos(a) * v * 1.2, vy: Math.sin(a) * v, g: g || 0.2, drag: 0.982, r: 1.2 + Math.random() * 1.6, age: 0, life: 18 + Math.random() * 18, c: cols[i % cols.length] });
  }
}
function impactFx(sd, b, n) {
  const fx = sd.fx, sp = sd.spec, fy = b.y + b.r;
  b.squash = 1;
  fx.rings.push({ x: b.x, y: fy, r: 5, grow: 3.4, life: 22, c: sp.hot, w: 4 });
  fx.rings.push({ x: b.x, y: fy, r: 3, grow: 5.6, life: 26, c: sp.rgb, w: 4 });
  switch (sp.key) {
    case 'speed':
      fx.rings.push({ x: b.x, y: fy, r: 4, grow: 9, life: 14, c: sp.acc, w: 3, flat: true });
      for (let i = 0; i < 4; i++) pushPart(fx, { type: 'bolt', pts: boltPoints(b.x, fy, -Math.PI * (0.1 + 0.8 * Math.random()), 38 + Math.random() * 34), x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 12, r: 2.2, c: i % 2 ? sp.acc : sp.hot });
      sparks(fx, b.x, fy, 18, 3, 10, [sp.hot, sp.rgb, sp.acc]); fx.shake = Math.max(fx.shake, 3.5); break;
    case 'double':
      fx.rings.push({ x: b.x, y: fy, r: 8, grow: 6, life: 18, c: sp.light, w: 3 });
      sparks(fx, b.x, fy, 14, 2, 7, [sp.light, sp.acc, [255, 255, 255]]); fx.shake = Math.max(fx.shake, 2.5); break;
    case 'grow':
      fx.rings.push({ x: b.x, y: b.y, r: b.r + 2, grow: 1.6, life: 26, c: sp.acc, w: 3, round: true });
      sparks(fx, b.x, fy, 14 + Math.min(14, n), 2, 7, [sp.hot, sp.rgb, sp.acc]); fx.shake = Math.max(fx.shake, 2 + n * 0.1); break;
    case 'gravity':
      for (let i = 0; i < 18; i++) { const a = i * GOLDEN_ANGLE, v = 0.7 + 0.36 * Math.sqrt(i); let vy = Math.sin(a) * v; if (vy > 0) vy = -vy * 0.7; pushPart(fx, { type: 'dot', x: b.x, y: fy, vx: Math.cos(a) * v, vy, g: 0.015, drag: 0.955, r: 1.8 + (i % 4) * 0.5, age: 0, life: 42 + (i % 5) * 6, c: i % 3 ? sp.acc : sp.light }); }
      fx.shake = Math.max(fx.shake, 3); break;
    case 'fib':
      for (let i = 0; i < 20; i++) { const a = i * GOLDEN_ANGLE, v = 0.8 + 0.4 * Math.sqrt(i); let vy = Math.sin(a) * v; if (vy > 0) vy = -vy * 0.7; pushPart(fx, { type: 'dot', x: b.x, y: fy, vx: Math.cos(a) * v, vy, g: 0.015, drag: 0.955, r: 1.8 + (i % 4) * 0.5, age: 0, life: 42 + (i % 5) * 6, c: i % 3 === 0 ? sp.light : (i % 3 === 1 ? sp.acc : [255, 255, 255]) }); }
      fx.shake = Math.max(fx.shake, 3); break;
    case 'fact':
      fx.rings.push({ x: b.x, y: fy, r: 6, grow: 8, life: 22, c: sp.acc, w: 5, flat: true });
      sparks(fx, b.x, fy, 26, 3, 10, [sp.acc, sp.rgb, sp.hot]); fx.shake = Math.max(fx.shake, 6); break;
    case 'orbital':
      sparks(fx, b.x, fy, 14, 2, 7, [sp.hot, sp.rgb]); fx.shake = Math.max(fx.shake, 2.4); break;
    case 'rocket':
      sparks(fx, b.x, fy, 10, 2, 6, [sp.hot, sp.rgb, sp.acc]); fx.shake = Math.max(fx.shake, 2); break;
    case 'split':
      fx.rings.push({ x: b.x, y: b.y, r: 4, grow: 2.4, life: 16, c: sp.light, w: 3, round: true });
      sparks(fx, b.x, fy, 8, 2, 6, [sp.light, sp.rgb]); fx.shake = Math.max(fx.shake, 1.5); break;
  }
}
function hitSound(sd, n) {
  const k = sd.spec.key, i = sd.i;
  if (k === 'speed') { beep(110 + Math.min(n, 80) * 2, 0.12, 'sine', 0.2); beep(520 + n * 12, 0.05, 'sawtooth', 0.05); }
  else if (k === 'grow') { beep(120 + Math.min(n, 70) * 3, 0.2, 'sine', 0.22); beep(330 + Math.min(n, 70) * 9, 0.09, 'triangle', 0.06); }
  else if (k === 'fact') { beep(80, 0.3, 'sine', 0.3); beep(220 + n * 40, 0.12, 'sawtooth', 0.06); }
  else { const f = NOTES[n % NOTES.length] * (i ? 1 : 0.75); beep(f, 0.16, 'triangle', 0.1); beep(f * PHI / 2, 0.1, 'sine', 0.04); }
}

// ===== Duell-Logik =====
function ballHit(sd, b, lead, y1, budget) {
  const sp = sd.spec;
  sd.hits++;
  const n = sd.hits;
  const dmg = Math.round(sp.dmg(n) * sd.C);
  sd.total += dmg;
  if (lead || Math.random() < 0.2) addPopup(sd.i, b.x, b.y - b.r - 6, '-' + formatNum(dmg), rgba(sp.rgb, 1));
  if (lead || budget.fx > 0) { impactFx(sd, b, n); if (!lead) budget.fx--; } else b.squash = 1;
  if (budget.snd > 0) { hitSound(sd, n); budget.snd--; }
  if (sp.onHit) { sp.onHit(sd, b, n); b.y = y1 - b.r; }
  if (sp.key === 'orbital') addSat(sd);
  if (sp.key === 'split' && sd.clones.length + 1 < SPLIT_MAX && sd.splitTimer >= SPLIT_GAP) {
    sd.splitTimer = 0;
    sd.clones.push({ x: b.x, y: b.y, vx: (-b.vx) || BALL_SPEED, vy: -BOUNCE_VY * (0.5 + 0.5 * sd.rnd()), r: b.r, dt: 1, squash: 1, trail: [] });
    sd.fx.rings.push({ x: b.x, y: b.y, r: 4, grow: 2.4, life: 16, c: sp.acc, w: 3, round: true });
    for (let i = 0; i < 6; i++) { const a = Math.random() * 6.28, v = 1.5 + Math.random() * 2.5; pushPart(sd.fx, { type: 'dot', x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0, drag: 0.95, r: 1.6, age: 0, life: 24, c: sp.acc }); }
    beep(900, 0.08, 'square', 0.06);
  }
  dealDamage(sd, dmg);
}

function stepSide(sd) {
  if (sd.fin >= 0 || isDepleted(sd.bars)) return;
  const g = G[sd.i], sp = sd.spec;
  const floor = g.arenaY1 + activeBar(sd.bars) * BAR_H;
  const x0 = 12, x1 = W - 12, y0 = g.arenaY0 + 10, y1 = floor - 10;
  const budget = { fx: 3, snd: 1 };
  if (sp.key === 'split') sd.splitTimer++;
  const balls = [sd.ball, ...sd.clones];
  for (let bi = 0; bi < balls.length; bi++) {
    const b = balls[bi];
    const dt = sp.dt(sd) * TF * (TM[sp.key] || 1), gm = sp.gm ? sp.gm(sd) : 1;
    b.dt = dt;
    b.vy += GRAVITY * gm * dt;
    if (b.vy > MAX_FALL_SPEED) b.vy = MAX_FALL_SPEED;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x - b.r < x0) { b.x = x0 + b.r; b.vx *= -1; }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = '900 44px Arial'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.fillStyle = '#ffd23c';
  ctx.globalAlpha = ease((T.t - 12) / 20);
  ctx.strokeText('CHAMPION', W / 2, cy + R + 70); ctx.fillText('CHAMPION', W / 2, cy + R + 70);
  ctx.font = '900 30px Arial'; ctx.lineWidth = 6; ctx.fillStyle = '#fff';
  ctx.strokeText(sp.title, W / 2, cy + R + 118); ctx.fillText(sp.title, W / 2, cy + R + 118);
  ctx.globalAlpha = 1;
  for (const p of T.conf) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = rgba(p.c, Math.min(1, (1 - p.age / p.life) * 1.6)); ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1); ctx.restore(); }
}

// ===== Phasen =====
const DUR = { intro: 75, pre: 24, zin: 150, hold: 55, zout: 60, adv: 34 };
function setPhase(p) { T.phase = p; T.t = 0; }
function startGame() {
  if (started) return;
  ensureAudio(); started = true; gameOver = false; slotsInit(); T.conf = [];
  for (let m = 0; m < M0; m++) T.slots[OUT_LVL[m]][MATCHES[m].o] = PRE[m];
  setPhase('intro');
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function stageOf() { return MATCHES[T.m].name; }
function update() {
  if (!started) return;
  popups.forEach(p => p.age++); popups = popups.filter(p => p.age <= 44);
  T.t++;
  switch (T.phase) {
    case 'intro': if (T.t >= DUR.intro) { beginMatch(M0); setPhase('pre'); } break;
    case 'pre': if (T.t >= DUR.pre) { setPhase('zin'); beep(300, 0.4, 'sine', 0.12); } break;
    case 'zin': if (T.t >= DUR.zin) setPhase('fight'); break;
    case 'fight':
      for (let k = 0; k < TS; k++) duelStep();
      updateFx(S[0]); updateFx(S[1]);
      if (duel.over) { duel.t++; if (duel.t >= DUR.hold) { setPhase('zout'); beep(260, 0.4, 'sine', 0.12); } }
      break;
    case 'zout':
      updateFx(S[0]); updateFx(S[1]);
      if (T.t >= DUR.zout) {
        const M = MATCHES[T.m], w = duel.winner, wk = S[w].key;
        T.slots[OUT_LVL[T.m]][M.o] = wk;
        T.pop = { l: OUT_LVL[T.m], i: M.o };
        beep(784, 0.12, 'triangle', 0.12); beep(1047, 0.2, 'triangle', 0.1);
        setPhase('adv');
      }
      break;
    case 'adv':
      if (T.t >= DUR.adv) {
        T.pop = null;
        if (SINGLE) { if (T.m === MATCHES.length - 1) setPhase('champ'); else setPhase('end'); gameOver = true; }
        else if (T.m + 1 < MATCHES.length) { beginMatch(T.m + 1); setPhase('pre'); }
        else { setPhase('champ'); gameOver = true; }
      }
      break;
    case 'champ':
      if (T.t % 3 === 0 && T.conf.length < 260) {
        const sp = SPECS[T.slots[4][0]], pal = [sp.rgb, sp.hot, sp.acc, [255, 210, 60], [255, 255, 255]];
        for (let i = 0; i < 4; i++) T.conf.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 3, g: 0.05, r: 2.4 + Math.random() * 2.6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, age: 0, life: 150 + Math.random() * 80, c: pal[(Math.random() * pal.length) | 0] });
      }
      for (const p of T.conf) { p.age++; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr; }
      T.conf = T.conf.filter(p => p.age < p.life);
      if (T.t === 3 || T.t === 15) { beep(523, 0.2, 'triangle', 0.12); beep(784, 0.3, 'triangle', 0.1); beep(1047, 0.4, 'triangle', 0.1); }
      break;
  }
}
function compose(p, c) {   // p: 0 = Turnierbaum, 1 = Duell
  const sB = 1 + 6.5 * ease(p);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(sB, sB); ctx.translate(-c.x, -c.y);
  drawBracket(T.m, null);
  ctx.restore();
  const pe = ease(p), a = ease((p - 0.25) / 0.6);
  if (a > 0) {
    const k = 0.14 + 0.86 * pe * pe;
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(c.x + (W / 2 - c.x) * pe, c.y + (H / 2 - c.y) * pe); ctx.scale(k, k); ctx.translate(-W / 2, -H / 2);
    drawDuel(stageOf());
    ctx.restore();
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#e9ddc4'; ctx.fillRect(0, 0, W, H);
  switch (T.phase) {
    case 'idle': case 'intro': drawBracket(-1, null); break;
    case 'pre': drawBracket(T.m, null); break;
    case 'zin': compose(T.t / DUR.zin, matchCenter(T.m)); break;
    case 'fight': drawDuel(stageOf()); break;
    case 'zout': compose(1 - T.t / DUR.zout, matchCenter(T.m)); break;
    case 'end': drawBracket(-1, null); break;
    case 'adv': { const pi = T.pop ? { l: T.pop.l, i: T.pop.i, u: Math.min(1, T.t / 24) } : null; drawBracket(-1, pi); break; }
    case 'champ': drawChampion(); break;
  }
  if (T.phase === 'intro') {
    const a = ease(T.t / 15) * (1 - ease((T.t - 55) / 20));
    ctx.globalAlpha = a; ctx.fillStyle = '#1b1608'; ctx.font = '900 30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(MATCHES[M0].name, W / 2, 880); ctx.globalAlpha = 1;
  }
}
window.__api = { soloTime, SPECS };

slotsInit();
const STEP_MS = 1000 / 60;
let lastT = 0, acc = 0;
function loop(t) {
  if (!lastT) lastT = t;
  acc += Math.min(t - lastT, 100); lastT = t;
  while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
