<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fibonacci Ball vs Golden Ratio Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 210;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_CHECKER_Y0 = TOP_ARENA_Y1 + BAR_H * 3;
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_CHECKER_Y0 = BOT_ARENA_Y1 + BAR_H * 3;
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Farben
const TOP_COLOR = '#3b82c4';  // Fibonacci Ball - Blau
const BOT_COLOR = '#C9A15C';  // Golden Ratio Ball - Gold

// Jeder Ball hat 3 Balken (HP), der Boden ist immer der aktive Balken.
const BAR_HEALTHS = [1000, 10000000, 100000000000];

// Identische Physik für beide Bälle
const GRAVITY = 0.22;
const MAX_FALL_SPEED = 30;
const BOUNCE_VY = 9;
const BALL_SPEED = 3.2;

const PHI = (1 + Math.sqrt(5)) / 2; // ≈ 1,6180339887

function fibonacci(n) {
  let a = 1, b = 1;
  if (n <= 2) return 1;
  for (let i = 3; i <= n; i++) {
    const c = a + b;
    a = b;
    b = c;
  }
  return b;
}
// Golden-Ratio-Schaden: φ^n, aufgerundet — wächst mit fast identischer Rate wie Fibonacci
// (fib(n) ≈ φ^n / √5), aber ohne die √5-Normierung, also durchgehend etwas stärker
function goldenDamage(n) {
  return Math.round(Math.pow(PHI, n));
}

function formatNum(v) {
  return Math.round(v).toLocaleString('de-DE');
}

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function topHitSound(n) { beep(300 + n * 6, 0.16, 'triangle', 0.14); }
function botHitSound(n) { beep(220 + n * 6, 0.16, 'sine', 0.14); }

function applyDamage(bars, dmg) {
  for (let i = 0; i < bars.length; i++) {
    if (bars[i] > 0) {
      bars[i] -= dmg;
      if (bars[i] < 0) bars[i] = 0;
      return;
    }
  }
}
function isFullyDepleted(bars) { return bars.every(h => h <= 0); }
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

let topBall, botBall, topBars, botBars, topHitCount, botHitCount, topDamage, botDamage;
let popups, started, gameOver, winner;

function init() {
  const tAngle = Math.random() * Math.PI * 2;
  topBall = {
    x: W / 2, y: TOP_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(tAngle) * BALL_SPEED, vy: Math.sin(tAngle) * BALL_SPEED,
    r: 16,
  };
  const bAngle = Math.random() * Math.PI * 2;
  botBall = {
    x: W / 2, y: BOT_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(bAngle) * BALL_SPEED, vy: Math.sin(bAngle) * BALL_SPEED,
    r: 16,
  };
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  topHitCount = 0;
  botHitCount = 0;
  topDamage = 0;
  botDamage = 0;
  popups = [];
  gameOver = false;
  winner = null;
  started = false;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, color) { popups.push({ x, y, text, color, age: 0 }); }

function update() {
  if (!started || gameOver) return;

  // Oben: Fibonacci Ball
  const topFloor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
  const tx0 = 12, tx1 = W - 12, ty0 = TOP_ARENA_Y0 + 10, ty1 = topFloor - 10;
  topBall.vy += GRAVITY;
  if (topBall.vy > MAX_FALL_SPEED) topBall.vy = MAX_FALL_SPEED;
  topBall.x += topBall.vx;
  topBall.y += topBall.vy;
  if (topBall.x - topBall.r < tx0) { topBall.x = tx0 + topBall.r; topBall.vx *= -1; }
  if (topBall.x + topBall.r > tx1) { topBall.x = tx1 - topBall.r; topBall.vx *= -1; }
  if (topBall.y - topBall.r < ty0) { topBall.y = ty0 + topBall.r; topBall.vy *= -1; }
  if (topBall.y + topBall.r > ty1) {
    topBall.y = ty1 - topBall.r;
    if (!isFullyDepleted(topBars)) {
      topBall.vy = -BOUNCE_VY;
      topHitCount++;
      const dmg = fibonacci(topHitCount);
      topDamage += dmg;
      applyDamage(topBars, dmg);
      addPopup(topBall.x, topBall.y, '-' + formatNum(dmg), TOP_COLOR);
      topHitSound(topHitCount);
    } else {
      topBall.vy = 0;
      if (!gameOver) { gameOver = true; winner = 'top'; }
    }
  }

  // Unten: Golden Ratio Ball
  const botFloor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
  const bx0 = 12, bx1 = W - 12, by0 = BOT_ARENA_Y0 + 10, by1 = botFloor - 10;
  botBall.vy += GRAVITY;
  if (botBall.vy > MAX_FALL_SPEED) botBall.vy = MAX_FALL_SPEED;
  botBall.x += botBall.vx;
  botBall.y += botBall.vy;
  if (botBall.x - botBall.r < bx0) { botBall.x = bx0 + botBall.r; botBall.vx *= -1; }
  if (botBall.x + botBall.r > bx1) { botBall.x = bx1 - botBall.r; botBall.vx *= -1; }
  if (botBall.y - botBall.r < by0) { botBall.y = by0 + botBall.r; botBall.vy *= -1; }
  if (botBall.y + botBall.r > by1) {
    botBall.y = by1 - botBall.r;
    if (!isFullyDepleted(botBars)) {
      botBall.vy = -BOUNCE_VY;
      botHitCount++;
      const dmg = goldenDamage(botHitCount);
      botDamage += dmg;
      applyDamage(botBars, dmg);
      addPopup(botBall.x, botBall.y, '-' + formatNum(dmg), BOT_COLOR);
      botHitSound(botHitCount);
    } else {
      botBall.vy = 0;
      if (!gameOver) { gameOver = true; winner = 'bot'; }
    }
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }
}

function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}
function drawSymbolBall(x, y, r, color, symbol) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '900 ' + Math.round(r * 1.1) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(symbol, x, y + 1);
}
function drawHealthBar(y0, y1, bg, health, maxHealth) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, y0, W * (health / maxHealth), y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.fillStyle = '#fff';
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(formatNum(health), W / 2, (y0 + y1) / 2);
}
function drawSideBars(bars, arenaY1orig, color) {
  const activeIdx = getActiveBarIndex(bars);
  const floor = arenaY1orig + activeIdx * BAR_H;
  for (let i = activeIdx; i < bars.length; i++) {
    const y0 = floor + (i - activeIdx) * BAR_H;
    drawHealthBar(y0, y0 + BAR_H, color, bars[i], BAR_HEALTHS[i]);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  // Top-Label
  ctx.fillStyle = TOP_COLOR;
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('FIBONACCI BALL', W / 2, LABEL_H / 2);

  const topActiveIdx = getActiveBarIndex(topBars);
  const topFloorY = TOP_ARENA_Y1 + topActiveIdx * BAR_H;
  drawArenaBg(TOP_ARENA_Y0, topFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TOP_ARENA_Y0, W, topFloorY - TOP_ARENA_Y0);
  ctx.clip();
  drawSymbolBall(topBall.x, topBall.y, topBall.r, TOP_COLOR, 'F');
  for (const p of popups) {
    if (p.color !== TOP_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = TOP_COLOR;
    ctx.font = 'bold 14px Arial';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawSideBars(topBars, TOP_ARENA_Y1, TOP_COLOR);
  drawChecker(TOP_CHECKER_Y0, TOP_CHECKER_Y1);

  // VS
  ctx.fillStyle = '#111';
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  // Bottom-Label
  ctx.fillStyle = BOT_COLOR;
  ctx.font = '900 20px Arial';
  ctx.fillText('GOLDEN RATIO BALL', W / 2, (BOT_LABEL_Y0 + BOT_LABEL_Y1) / 2);

  const botActiveIdx = getActiveBarIndex(botBars);
  const botFloorY = BOT_ARENA_Y1 + botActiveIdx * BAR_H;
  drawArenaBg(BOT_ARENA_Y0, botFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, BOT_ARENA_Y0, W, botFloorY - BOT_ARENA_Y0);
  ctx.clip();
  drawSymbolBall(botBall.x, botBall.y, botBall.r, BOT_COLOR, 'φ');
  for (const p of popups) {
    if (p.color !== BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = BOT_COLOR;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawSideBars(botBars, BOT_ARENA_Y1, BOT_COLOR);
  drawChecker(BOT_CHECKER_Y0, BOT_CHECKER_Y1);

  if (gameOver) {
    const top = winner === 'top';
    const y0 = top ? TOP_ARENA_Y0 : BOT_ARENA_Y0;
    const y1 = top ? TOP_CHECKER_Y0 : BOT_CHECKER_Y0;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, y0, W, y1 - y0);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 24px Arial';
    ctx.fillText((top ? 'FIBONACCI' : 'GOLDEN RATIO') + ' BALL WINS', W / 2, (y0 + y1) / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
