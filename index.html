<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Can Factorial Deal Infinite Damage?</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #faf3e0;
    overflow: hidden;
    height: 100%;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  canvas {
    display: block;
  }
  #title {
    position: relative;
    margin-top: 3%;
    color: #111;
    font-weight: 900;
    font-size: clamp(16px, 4vw, 24px);
    text-align: center;
    width: 94%;
    line-height: 1.25;
  }
  #title .accent {
    background: #eab308;
    color: #111;
    padding: 0 4px;
    border-radius: 3px;
  }
  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2%;
  }
  #timer {
    position: relative;
    margin-top: 1.5%;
    color: #22c55e;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 900;
  }
  #damage {
    position: relative;
    margin-top: 2.5%;
    color: #f2a900;
    font-weight: 900;
    font-size: clamp(16px, 3.5vw, 22px);
    background: rgba(0,0,0,0.05);
    padding: 4px 14px;
    border-radius: 6px;
    letter-spacing: 1px;
  }
  #start-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-weight: 900;
    font-size: clamp(18px, 4.5vw, 28px);
    text-align: center;
    background: rgba(0,0,0,0.75);
    padding: 14px 22px;
    border-radius: 14px;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
    cursor: pointer;
    z-index: 10;
  }
  #restart {
    position: relative;
    margin-top: 3%;
    background: #17b3d4;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #restart:hover { background: #12a0be; }
</style>
</head>
<body>
<div id="wrap">
  <div id="title">Can <span class="accent">FACTORIAL</span> ! Deal Infinite Damage in 60 Seconds?</div>
  <div id="timer">55.4s</div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Press K<br>to start</div>
  </div>
  <div id="damage">DAMAGE: 0</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const damageEl = document.getElementById('damage');

function size() {
  const reserved = 220;
  const s = Math.min(window.innerWidth * 0.92, window.innerHeight - reserved);
  canvas.width = s;
  canvas.height = s;
}
size();

const MARGIN = 10;
const box = {
  left: MARGIN,
  right: canvas.width - MARGIN,
  top: MARGIN,
  bottom: canvas.height - MARGIN
};
const boxCx = (box.left + box.right) / 2;
const boxCy = (box.top + box.bottom) / 2;

const START_HEALTH = Infinity;
const START_TIME = 60;
const BIG_RADIUS = (box.right - box.left) * 0.32;
const BALL_RADIUS = 34;
const BALL_SPEED = 7.5 * 0.9 * 0.75 * 1.25 * 1.3;
const BIG_CIRCLE_SPEED = 0.6; // sehr langsame Eigenbewegung

let health = START_HEALTH;
let factCounter = 0, factValue = 1;
let currentDamage = 0;
let ball = null;
let bigCircle = null;
let particles = [];
let damagePopups = [];
let started = false;
let startTime = 0;
let touchingBig = false;
let destroyed = false;

// --- Sound Engine (Web Audio API) ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* Audio nicht verfügbar */ }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  if (audioCtx) {
    const unlockOsc = audioCtx.createOscillator();
    const unlockGain = audioCtx.createGain();
    unlockGain.gain.value = 0;
    unlockOsc.connect(unlockGain);
    unlockGain.connect(audioCtx.destination);
    unlockOsc.start();
    unlockOsc.stop(audioCtx.currentTime + 0.01);
  }
}

function playWallSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(500 + Math.random() * 150, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.06);
}

function playHitSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(180, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}
// --- Ende Sound Engine ---

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function formatHealth(n) {
  if (n === Infinity) return '∞';
  return Math.max(0, Math.round(n)).toString();
}

function spawnDustParticles() {
  const count = 60;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.random() * BIG_RADIUS;
    const speed = 0.5 + Math.random() * 2.2;
    particles.push({
      x: bigCircle.x + Math.cos(a) * d,
      y: bigCircle.y + Math.sin(a) * d,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: 35 + Math.random() * 25,
      maxLife: 60,
      size: 1 + Math.random() * 2.2
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateDamagePopups() {
  for (let i = damagePopups.length - 1; i >= 0; i--) {
    const p = damagePopups[i];
    p.y -= 0.6;
    p.life--;
    if (p.life <= 0) damagePopups.splice(i, 1);
  }
}

function init() {
  health = START_HEALTH;
  factCounter = 0;
  factValue = 1;
  currentDamage = 0;
  started = false;
  touchingBig = false;
  destroyed = false;
  particles = [];
  damagePopups = [];
  damageEl.textContent = `DAMAGE: 0`;
  timerEl.textContent = `${START_TIME.toFixed(1)}s`;
  timerEl.style.color = '#22c55e';

  const bigDir = Math.random() * Math.PI * 2;
  bigCircle = {
    x: boxCx,
    y: boxCy,
    vx: Math.cos(bigDir) * BIG_CIRCLE_SPEED,
    vy: Math.sin(bigDir) * BIG_CIRCLE_SPEED,
    r: BIG_RADIUS
  };

  const dir = Math.random() * Math.PI * 2;
  ball = {
    x: boxCx + BIG_RADIUS + BALL_RADIUS + 4,
    y: boxCy,
    vx: Math.cos(dir) * BALL_SPEED,
    vy: Math.sin(dir) * BALL_SPEED,
    r: BALL_RADIUS
  };

  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'flex';
}
init();

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  startTime = Date.now();
  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => {
  if (e.key === 'k' || e.key === 'K') startGame();
});

function nextFactDamage() {
  factCounter++;
  factValue *= factCounter;
  return factValue;
}

function update() {
  if (!started) return;

  const elapsed = (Date.now() - startTime) / 1000;
  const remaining = START_TIME - elapsed;
  timerEl.textContent = `${remaining.toFixed(1)}s`;
  timerEl.style.color = remaining < 0 ? '#ef4444' : '#22c55e';

  updateParticles();
  updateDamagePopups();

  ball.x += ball.vx;
  ball.y += ball.vy;

  // Wände (Ball)
  if (ball.x - ball.r < box.left) {
    ball.x = box.left + ball.r;
    ball.vx *= -1;
    playWallSound();
  } else if (ball.x + ball.r > box.right) {
    ball.x = box.right - ball.r;
    ball.vx *= -1;
    playWallSound();
  }
  if (ball.y - ball.r < box.top) {
    ball.y = box.top + ball.r;
    ball.vy *= -1;
    playWallSound();
  } else if (ball.y + ball.r > box.bottom) {
    ball.y = box.bottom - ball.r;
    ball.vy *= -1;
    playWallSound();
  }

  if (destroyed) return;

  // Der große Kreis bewegt sich langsam und prallt auch von den Wänden ab
  bigCircle.x += bigCircle.vx;
  bigCircle.y += bigCircle.vy;
  if (bigCircle.x - bigCircle.r < box.left) {
    bigCircle.x = box.left + bigCircle.r;
    bigCircle.vx *= -1;
  } else if (bigCircle.x + bigCircle.r > box.right) {
    bigCircle.x = box.right - bigCircle.r;
    bigCircle.vx *= -1;
  }
  if (bigCircle.y - bigCircle.r < box.top) {
    bigCircle.y = box.top + bigCircle.r;
    bigCircle.vy *= -1;
  } else if (bigCircle.y + bigCircle.r > box.bottom) {
    bigCircle.y = box.bottom - bigCircle.r;
    bigCircle.vy *= -1;
  }

  // Kollision mit dem großen Kreis
  const d = dist(ball.x, ball.y, bigCircle.x, bigCircle.y);
  if (d < BIG_RADIUS + ball.r) {
    if (!touchingBig && health > 0) {
      const dmg = nextFactDamage();
      currentDamage = dmg;
      health = Math.max(0, health - dmg);
      if (Number.isNaN(health)) health = Infinity;
      damageEl.textContent = `DAMAGE: ${currentDamage}`;
      playHitSound();
      damagePopups.push({
        x: ball.x,
        y: ball.y,
        text: `-${dmg}`,
        life: 40,
        maxLife: 40
      });
      if (health <= 0 || dmg === Infinity) {
        destroyed = true;
        spawnDustParticles();
      }
    }
    touchingBig = true;

    const nx = (ball.x - bigCircle.x) / d;
    const ny = (ball.y - bigCircle.y) / d;
    const dot = ball.vx * nx + ball.vy * ny;
    ball.vx -= 2 * dot * nx;
    ball.vy -= 2 * dot * ny;
    const overlap = BIG_RADIUS + ball.r - d;
    ball.x += nx * overlap;
    ball.y += ny * overlap;
  } else {
    touchingBig = false;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Box
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(box.left, box.top, box.right - box.left, box.bottom - box.top);
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = 4;
  ctx.strokeRect(box.left, box.top, box.right - box.left, box.bottom - box.top);

  // Großer Kreis (Health) - nur solange nicht zerstört
  if (!destroyed) {
    ctx.beginPath();
    ctx.arc(bigCircle.x, bigCircle.y, BIG_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#c7c7c7';
    ctx.fill();

    // Health-Zahl, Schriftgröße an Kreisbreite anpassen
    const healthText = formatHealth(health);
    let fontSize = BIG_RADIUS * 0.34;
    ctx.font = `900 ${fontSize}px Arial`;
    while (ctx.measureText(healthText).width > BIG_RADIUS * 1.8 && fontSize > 6) {
      fontSize -= 1;
      ctx.font = `900 ${fontSize}px Arial`;
    }
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(healthText, bigCircle.x, bigCircle.y);
  }

  // Staub-Partikel (Zerfall)
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(120, 120, 120, ${alpha})`;
    ctx.fill();
  }

  // Damage-Popups
  for (const p of damagePopups) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.font = '900 16px Arial';
    ctx.fillStyle = `rgba(220, 38, 38, ${alpha})`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.text, p.x, p.y);
  }

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#eab308';
  ctx.fill();
  ctx.font = `900 ${ball.r * 1.3}px Arial`;
  ctx.fillStyle = '#111111';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('!', ball.x, ball.y);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.getElementById('wrap').insertAdjacentHTML('beforeend',
  '<button id="restart">Neu starten</button>');
document.getElementById('restart').addEventListener('click', init);
</script>
</body>
</html>
