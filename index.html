<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fibonacci Ball vs Factorial Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 260;
const BAR_H = 66;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_BAR_Y0 = TOP_ARENA_Y1;
const TOP_BAR_Y1 = TOP_BAR_Y0 + BAR_H;
const TOP_CHECKER_Y0 = TOP_BAR_Y1;
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_BAR_Y0 = BOT_ARENA_Y1;
const BOT_BAR_Y1 = BOT_BAR_Y0 + BAR_H;
const BOT_CHECKER_Y0 = BOT_BAR_Y1;
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Identische, normale Physik für beide Bälle (kalibriert auf ~1.36s pro Bodenkontakt)
const TOP_COLOR = '#3b82c4';  // Fibonacci Ball - Blau
const BOT_COLOR = '#c4483b';  // Factorial Ball - Rot
const GRAVITY = 0.22;
const MAX_FALL_SPEED = 30;
const BOUNCE_VY = 9;
const BALL_SPEED = 3.2;

// HP so kalibriert, dass Factorial Ball nach ~55 Treffern (~75 Sekunden) den Gegner besiegt
const HP_MAX = 1e80;

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function topHitSound(n) {}
function botHitSound(n) { beep(220 + n * 5, 0.16, 'sine', 0.14); }

function fibonacci(n) {
  let a = 1, b = 1;
  if (n <= 2) return 1;
  for (let i = 3; i <= n; i++) {
    const c = a + b;
    a = b;
    b = c;
  }
  return b;
}
function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

let topBall, botBall, topHitCount, botHitCount, popups, started, gameOver, winner, topHp, botHp;

function init() {
  const tAngle = Math.random() * Math.PI * 2;
  topBall = {
    x: W / 2,
    y: TOP_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(tAngle) * BALL_SPEED,
    vy: Math.sin(tAngle) * BALL_SPEED,
    r: 16,
  };
  const bAngle = Math.random() * Math.PI * 2;
  botBall = {
    x: W / 2,
    y: BOT_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(bAngle) * BALL_SPEED,
    vy: Math.sin(bAngle) * BALL_SPEED,
    r: 16,
  };
  topHitCount = 0;
  botHitCount = 0;
  popups = [];
  gameOver = false;
  winner = null;
  topHp = HP_MAX;
  botHp = HP_MAX;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, color) { popups.push({ x, y, text, color, age: 0 }); }

function update() {
  if (!started || gameOver) return;

  // Oben: Fibonacci Ball (6x Geschwindigkeit über durchgängigen Zeitfaktor)
  const tx0 = 12, tx1 = W - 12, ty0 = TOP_ARENA_Y0 + 10, ty1 = TOP_ARENA_Y1 - 10;
  const EXPONENTIAL_SPEED_MULT = 4;
  topBall.vy += GRAVITY * EXPONENTIAL_SPEED_MULT;
  if (topBall.vy > MAX_FALL_SPEED * EXPONENTIAL_SPEED_MULT) topBall.vy = MAX_FALL_SPEED * EXPONENTIAL_SPEED_MULT;
  topBall.x += topBall.vx * EXPONENTIAL_SPEED_MULT;
  topBall.y += topBall.vy * EXPONENTIAL_SPEED_MULT;
  if (topBall.x - topBall.r < tx0) { topBall.x = tx0 + topBall.r; topBall.vx *= -1; }
  if (topBall.x + topBall.r > tx1) { topBall.x = tx1 - topBall.r; topBall.vx *= -1; }
  if (topBall.y - topBall.r < ty0) { topBall.y = ty0 + topBall.r; topBall.vy *= -1; }
  if (topBall.y + topBall.r > ty1) {
    topBall.y = ty1 - topBall.r;
    topBall.vy = -BOUNCE_VY;
    topHitCount++;
    const dmg = Math.pow(2, topHitCount);
    addPopup(topBall.x, topBall.y, '-' + dmg.toLocaleString('de-DE'), TOP_COLOR);
    topHitSound(topHitCount);
    botHp = Math.max(0, botHp - dmg);
    if (botHp <= 0 && !gameOver) { gameOver = true; winner = 'top'; }
  }

  // Unten: Factorial Ball (3x Geschwindigkeit über durchgängigen Zeitfaktor)
  const bx0 = 12, bx1 = W - 12, by0 = BOT_ARENA_Y0 + 10, by1 = BOT_ARENA_Y1 - 10;
  const FACTORIAL_SPEED_MULT = 1;
  botBall.vy += GRAVITY * FACTORIAL_SPEED_MULT;
  if (botBall.vy > MAX_FALL_SPEED * FACTORIAL_SPEED_MULT) botBall.vy = MAX_FALL_SPEED * FACTORIAL_SPEED_MULT;
  botBall.x += botBall.vx * FACTORIAL_SPEED_MULT;
  botBall.y += botBall.vy * FACTORIAL_SPEED_MULT;
  if (botBall.x - botBall.r < bx0) { botBall.x = bx0 + botBall.r; botBall.vx *= -1; }
  if (botBall.x + botBall.r > bx1) { botBall.x = bx1 - botBall.r; botBall.vx *= -1; }
  if (botBall.y - botBall.r < by0) { botBall.y = by0 + botBall.r; botBall.vy *= -1; }
  if (botBall.y + botBall.r > by1) {
    botBall.y = by1 - botBall.r;
    botBall.vy = -BOUNCE_VY;
    botHitCount++;
    const dmg = factorial(botHitCount);
    addPopup(botBall.x, botBall.y, '-' + dmg.toLocaleString('de-DE'), BOT_COLOR);
    botHitSound(botHitCount);
    topHp = Math.max(0, topHp - dmg);
    if (topHp <= 0 && !gameOver) { gameOver = true; winner = 'bot'; }
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }
}

function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}
function drawBall(x, y, r, color) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
}
function drawHpBar(y0, y1, color, hp) {
  ctx.fillStyle = hp > 0 ? color : '#e9ddc4';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  if (hp > 0) {
    ctx.fillStyle = '#fff';
    ctx.font = '900 42px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('∞', W / 2, (y0 + y1) / 2 + 2);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  // Top-Label
  ctx.fillStyle = TOP_COLOR;
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('EXPONENTIAL BALL', W / 2, LABEL_H / 2);

  drawArenaBg(TOP_ARENA_Y0, TOP_ARENA_Y1);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TOP_ARENA_Y0, W, ARENA_H);
  ctx.clip();
  if (topHp > 0) drawBall(topBall.x, topBall.y, topBall.r, TOP_COLOR);
  for (const p of popups) {
    if (p.color !== TOP_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = TOP_COLOR;
    ctx.font = 'bold 14px Arial';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawHpBar(TOP_BAR_Y0, TOP_BAR_Y1, TOP_COLOR, topHp);
  drawChecker(TOP_CHECKER_Y0, TOP_CHECKER_Y1);

  // VS
  ctx.fillStyle = '#111';
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  // Bottom-Label
  ctx.fillStyle = BOT_COLOR;
  ctx.font = '900 20px Arial';
  ctx.fillText('FACTORIAL BALL', W / 2, (BOT_LABEL_Y0 + BOT_LABEL_Y1) / 2);

  drawArenaBg(BOT_ARENA_Y0, BOT_ARENA_Y1);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, BOT_ARENA_Y0, W, ARENA_H);
  ctx.clip();
  if (botHp > 0) drawBall(botBall.x, botBall.y, botBall.r, BOT_COLOR);
  for (const p of popups) {
    if (p.color !== BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = BOT_COLOR;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawHpBar(BOT_BAR_Y0, BOT_BAR_Y1, BOT_COLOR, botHp);
  drawChecker(BOT_CHECKER_Y0, BOT_CHECKER_Y1);

  if (gameOver) {
    const winColor = winner === 'top' ? TOP_COLOR : BOT_COLOR;
    const winY0 = winner === 'top' ? TOP_ARENA_Y0 : BOT_ARENA_Y0;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, winY0, W, ARENA_H);
    ctx.fillStyle = '#fff';
    ctx.font = '900 26px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((winner === 'top' ? 'FIBONACCI' : 'FACTORIAL') + ' BALL WINS', W / 2, winY0 + ARENA_H / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
