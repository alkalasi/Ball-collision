<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>+2 After The Ball Escapes</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  canvas {
    display: block;
  }
  #title {
    position: relative;
    margin-top: 4%;
    color: #fff;
    font-weight: 900;
    font-size: clamp(18px, 4.2vw, 28px);
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    width: 92%;
    line-height: 1.15;
  }
  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #status {
    position: relative;
    margin-top: 4%;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    opacity: 0.85;
  }
  #restart {
    position: relative;
    margin-top: 6%;
    background: #17b3d4;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #restart:hover { background: #12a0be; }
  #start-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 32px);
    text-align: center;
    background: rgba(0,0,0,0.75);
    padding: 16px 26px;
    border-radius: 16px;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="title">+2 after the ball escapes<br>until its chaos</div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Press K<br>to start</div>
  </div>
  <div id="status"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

function size() {
  const reserved = 200;
  const s = Math.min(window.innerWidth * 0.92, window.innerHeight - reserved);
  canvas.width = s;
  canvas.height = s;
}
size();

const MARGIN = 20;
const box = {
  left: MARGIN,
  right: canvas.width - MARGIN,
  top: MARGIN,
  bottom: canvas.height - MARGIN
};

const BALL_RADIUS = 9;
const GRAVITY = 0.22;
const INITIAL_SPEED = 2.5;
const HORIZONTAL_SPEED = 4.5;
const MAX_FALL_SPEED = 9;
const MAX_BALLS = 900;
const SCALE_THRESHOLD = 250;
const GAP_WIDTH = (box.right - box.left) * 0.22;
const GAP_SPEED = 2.2; // px pro Frame

let gapX = box.left + GAP_WIDTH / 2;
let gapDir = 1; // 1 = nach rechts, -1 = nach links

let balls = [];
let escapedCount = 0;

// --- Sound Engine (Web Audio API) ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* Audio nicht verfügbar */ }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  // Stiller Mini-Ton, um den Audio-Kontext auf iOS Safari zuverlässig zu entsperren
  if (audioCtx) {
    const unlockOsc = audioCtx.createOscillator();
    const unlockGain = audioCtx.createGain();
    unlockGain.gain.value = 0;
    unlockOsc.connect(unlockGain);
    unlockGain.connect(audioCtx.destination);
    unlockOsc.start();
    unlockOsc.stop(audioCtx.currentTime + 0.01);
  }
}
ensureAudio();
document.addEventListener('click', ensureAudio);
document.addEventListener('touchstart', ensureAudio);
document.addEventListener('keydown', ensureAudio);

function playWallSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(450 + Math.random() * 250, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.09);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.09);
}

function playEscapeSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(950, audioCtx.currentTime + 0.18);
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.22);
}
// --- Ende Sound Engine ---

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function randColor() {
  const h = Math.floor(Math.random() * 360);
  return `hsl(${h}, 80%, 55%)`;
}

function spawnBall(x, y) {
  return {
    x: x !== undefined ? x : box.left + Math.random() * (box.right - box.left),
    y: y !== undefined ? y : box.top + 20 + Math.random() * 20,
    vx: (Math.random() - 0.5) * INITIAL_SPEED,
    vy: 0,
    r: BALL_RADIUS,
    color: randColor()
  };
}

let started = false;

function init() {
  balls = [];
  escapedCount = 0;
  gapX = box.left + GAP_WIDTH / 2;
  gapDir = 1;
  started = false;
  balls.push(spawnBall(box.left + (box.right - box.left) * 0.45, box.top + 60));
  balls.push(spawnBall(box.left + (box.right - box.left) * 0.55, box.top + 60));
  updateStatus();
  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'flex';
}
init();

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => {
  if (e.key === 'k' || e.key === 'K') startGame();
});

function updateStatus() {
  statusEl.textContent = `Balls: ${balls.length}   |   Escaped: ${escapedCount}`;
}

function update() {
  if (!started) return;
  // Lücke bewegt sich hin und her
  gapX += GAP_SPEED * gapDir;
  const minGapX = box.left + GAP_WIDTH / 2;
  const maxGapX = box.right - GAP_WIDTH / 2;
  if (gapX >= maxGapX) {
    gapX = maxGapX;
    gapDir = -1;
  } else if (gapX <= minGapX) {
    gapX = minGapX;
    gapDir = 1;
  }

  const newBalls = [];
  const stillIn = [];

  for (const b of balls) {
    b.vy += GRAVITY;
    b.x += b.vx;
    b.y += b.vy;

    // Linke/rechte Wand
    if (b.x - b.r < box.left) {
      b.x = box.left + b.r;
      b.vx *= -1;
      playWallSound();
    } else if (b.x + b.r > box.right) {
      b.x = box.right - b.r;
      b.vx *= -1;
      playWallSound();
    }

    // Obere Wand
    if (b.y - b.r < box.top) {
      b.y = box.top + b.r;
      b.vy *= -1;
      playWallSound();
    }

    // Untere Wand / Lücke
    if (b.y + b.r > box.bottom) {
      const inGap = b.x > gapX - GAP_WIDTH / 2 && b.x < gapX + GAP_WIDTH / 2;
      if (inGap) {
        if (b.y - b.r > box.bottom + 10) {
          // entkommen -> mehr Bälle spawnen, sobald 250 erreicht wurden
          escapedCount++;
          playEscapeSound();
          const spawnCount = balls.length >= SCALE_THRESHOLD ? 4 : 2;
          for (let k = 0; k < spawnCount; k++) {
            if (balls.length + newBalls.length < MAX_BALLS) {
              newBalls.push(spawnBall());
            }
          }
          continue; // dieser Ball wird nicht in stillIn übernommen
        }
        // sonst: fällt gerade durch die Lücke, keine Reflektion
      } else {
        b.y = box.bottom - b.r;
        b.vy *= -1;
        playWallSound();
      }
    }

    stillIn.push(b);
  }

  balls = stillIn;

  if (newBalls.length > 0) {
    balls = balls.concat(newBalls);
    updateStatus();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Hintergrund der Box
  ctx.fillStyle = '#f5efdc';
  ctx.fillRect(box.left, box.top, box.right - box.left, box.bottom - box.top);

  // Wände
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = 6;
  ctx.lineCap = 'square';

  // Oben
  ctx.beginPath();
  ctx.moveTo(box.left, box.top);
  ctx.lineTo(box.right, box.top);
  ctx.stroke();

  // Links
  ctx.beginPath();
  ctx.moveTo(box.left, box.top);
  ctx.lineTo(box.left, box.bottom);
  ctx.stroke();

  // Rechts
  ctx.beginPath();
  ctx.moveTo(box.right, box.top);
  ctx.lineTo(box.right, box.bottom);
  ctx.stroke();

  // Unten (mit beweglicher Lücke)
  ctx.beginPath();
  ctx.moveTo(box.left, box.bottom);
  ctx.lineTo(gapX - GAP_WIDTH / 2, box.bottom);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(gapX + GAP_WIDTH / 2, box.bottom);
  ctx.lineTo(box.right, box.bottom);
  ctx.stroke();

  // Bälle
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.getElementById('wrap').insertAdjacentHTML('beforeend',
  '<button id="restart">Neu starten</button>');
document.getElementById('restart').addEventListener('click', init);
</script>
</body>
</html>
