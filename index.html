<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Which Ball Will Survive?</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  canvas {
    display: block;
  }
  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #countdown {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-weight: 900;
    font-size: clamp(60px, 15vw, 120px);
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
    pointer-events: none;
  }
  #title {
    position: relative;
    margin-top: 4%;
    color: #fff;
    font-weight: 900;
    font-size: clamp(20px, 4.5vw, 32px);
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    width: 90%;
    line-height: 1.15;
  }
  #status {
    position: relative;
    margin-top: 4%;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    opacity: 0.9;
  }
  #restart {
    position: relative;
    margin-top: 6%;
    background: #17b3d4;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #restart:hover { background: #12a0be; }
</style>
</head>
<body>
<div id="wrap">
  <div id="title">Choose a color</div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="countdown"></div>
  </div>
  <div id="status"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const countdownEl = document.getElementById('countdown');

function size() {
  const reserved = 220; // Platz für Titel, Status und Button
  const s = Math.min(window.innerWidth * 0.92, window.innerHeight - reserved);
  canvas.width = s;
  canvas.height = s;
}
size();
window.addEventListener('resize', () => {
  size();
  circle.r = canvas.width / 2 - 10;
  circle.cx = canvas.width / 2;
  circle.cy = canvas.height / 2;
});

const circle = {
  cx: canvas.width / 2,
  cy: canvas.height / 2,
  r: canvas.width / 2 - 10
};

const BALL_RADIUS = 9;
const SPEED = 3.5;
const NUM_BALLS = 8;
const LINES_PER_BALL = 17;
const TOTAL_LINES = NUM_BALLS * LINES_PER_BALL; // 136
const CAPTURE_MARGIN = 1.5;

let balls = [];
let lines = [];
let finished = false;

// --- Sound Engine (Web Audio API, keine externen Dateien nötig) ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* Audio nicht verfügbar */ }
  } else if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
document.addEventListener('click', ensureAudio);
document.addEventListener('touchstart', ensureAudio);

function playTone(freq, duration, type, volume) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playCollisionSound() {
  playTone(550 + Math.random() * 250, 0.07, 'sine', 0.1);
}

function playDeathSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(480, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.4);
  gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}
function playVictorySound() {
  playTone(500, 0.15, 'triangle', 0.15);
  setTimeout(() => playTone(750, 0.25, 'triangle', 0.15), 120);
}
// --- Ende Sound Engine ---
let phase = 'countdown'; // 'countdown' | 'running' | 'finished'
let countdownTimer = null;
let gameStartTime = null;
const TOTAL_TIME_LIMIT = 70000; // 70 Sekunden Gesamtlimit
const SPEED_BOOST_THRESHOLD = 3;
const SPEED_BOOST_FACTOR = 1.06;
const MAX_SPEED = SPEED * 5;
let winnerColor = null;
let winnerHue = null;

function capSpeed(b) {
  const s = Math.hypot(b.vx, b.vy);
  if (s > MAX_SPEED) {
    b.vx = (b.vx / s) * MAX_SPEED;
    b.vy = (b.vy / s) * MAX_SPEED;
  }
}

function hueToName(h) {
  h = ((h % 360) + 360) % 360;
  if (h < 15 || h >= 345) return 'Red';
  if (h < 45) return 'Orange';
  if (h < 70) return 'Yellow';
  if (h < 170) return 'Green';
  if (h < 200) return 'Cyan';
  if (h < 260) return 'Blue';
  if (h < 290) return 'Purple';
  return 'Pink';
}

function declareWinner(winner) {
  finished = true;
  for (const b of balls) {
    if (b !== winner) b.alive = false;
  }
  winnerColor = winner.color;
  winnerHue = winner.hue;
  statusEl.style.color = '#fff';
  statusEl.textContent = `Winner: ${hueToName(winner.hue)}`;
  playVictorySound();
}

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function pointToSegmentDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return dist(px, py, x1, y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return dist(px, py, x1 + t * dx, y1 + t * dy);
}

function randColorFromHue(h) {
  return `hsl(${h}, 85%, 58%)`;
}

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  phase = 'countdown';
  titleEl.textContent = 'Choose a color';
  let value = 3;
  countdownEl.textContent = value;
  countdownEl.style.display = 'block';

  countdownTimer = setInterval(() => {
    value--;
    if (value <= 0) {
      clearInterval(countdownTimer);
      countdownEl.style.display = 'none';
      titleEl.textContent = 'Which BALL will manage to survive?';
      phase = 'running';
      gameStartTime = Date.now();
    } else {
      countdownEl.textContent = value;
    }
  }, 1000);
}

function init() {
  balls = [];
  lines = [];
  finished = false;
  gameStartTime = null;
  winnerColor = null;
  winnerHue = null;
  statusEl.textContent = '';

  // 8 Bälle gleichmäßig verteilt an der Wand
  for (let i = 0; i < NUM_BALLS; i++) {
    const angle = (i / NUM_BALLS) * Math.PI * 2;
    const x = circle.cx + Math.cos(angle) * (circle.r - BALL_RADIUS);
    const y = circle.cy + Math.sin(angle) * (circle.r - BALL_RADIUS);

    // Richtung: nach innen mit leichtem zufälligem Winkel-Offset
    const inward = angle + Math.PI + (Math.random() - 0.5) * 0.9;
    const hue = Math.floor((360 / NUM_BALLS) * i + Math.random() * 20);

    balls.push({
      id: i,
      x, y,
      vx: Math.cos(inward) * SPEED,
      vy: Math.sin(inward) * SPEED,
      r: BALL_RADIUS,
      hue,
      color: randColorFromHue(hue),
      alive: true
    });
  }

  // 136 Ankerpunkte gleichmäßig am Rand, je 17 einem Ball zugeordnet (dessen eigener Sektor)
  for (let i = 0; i < NUM_BALLS; i++) {
    for (let j = 0; j < LINES_PER_BALL; j++) {
      const k = i * LINES_PER_BALL + j;
      const angle = (k / TOTAL_LINES) * Math.PI * 2;
      lines.push({
        ax: circle.cx + Math.cos(angle) * circle.r,
        ay: circle.cy + Math.sin(angle) * circle.r,
        owner: i
      });
    }
  }

  startCountdown();
}
init();

function update() {
  if (finished || phase !== 'running') return;

  const alive = balls.filter(b => b.alive);
  const boostActive = alive.length <= SPEED_BOOST_THRESHOLD && alive.length > 1;

  for (const b of alive) {
    b.x += b.vx;
    b.y += b.vy;

    // Wandkollision (keine Gravitation, rein elastisch)
    const d = dist(b.x, b.y, circle.cx, circle.cy);
    if (d + b.r > circle.r) {
      const nx = (b.x - circle.cx) / d;
      const ny = (b.y - circle.cy) / d;
      const dot = b.vx * nx + b.vy * ny;
      b.vx -= 2 * dot * nx;
      b.vy -= 2 * dot * ny;
      const overlap = d + b.r - circle.r;
      b.x -= nx * overlap;
      b.y -= ny * overlap;
      playCollisionSound();

      if (boostActive) {
        b.vx *= SPEED_BOOST_FACTOR;
        b.vy *= SPEED_BOOST_FACTOR;
        capSpeed(b);
      }
    }
  }

  // Ball-Ball-Kollision (elastisch)
  for (let i = 0; i < alive.length; i++) {
    for (let j = i + 1; j < alive.length; j++) {
      const a = alive[i], bb = alive[j];
      const d = dist(a.x, a.y, bb.x, bb.y);
      if (d < a.r + bb.r && d > 0) {
        const nx = (bb.x - a.x) / d;
        const ny = (bb.y - a.y) / d;
        const dvx = bb.vx - a.vx;
        const dvy = bb.vy - a.vy;
        const rel = dvx * nx + dvy * ny;
        if (rel < 0) {
          a.vx += rel * nx;
          a.vy += rel * ny;
          bb.vx -= rel * nx;
          bb.vy -= rel * ny;
          const overlap = (a.r + bb.r - d) / 2;
          a.x -= nx * overlap;
          a.y -= ny * overlap;
          bb.x += nx * overlap;
          bb.y += ny * overlap;
          playCollisionSound();

          if (boostActive) {
            a.vx *= SPEED_BOOST_FACTOR;
            a.vy *= SPEED_BOOST_FACTOR;
            bb.vx *= SPEED_BOOST_FACTOR;
            bb.vy *= SPEED_BOOST_FACTOR;
            capSpeed(a);
            capSpeed(bb);
          }
        }
      }
    }
  }

  // Linien klauen: berührt ein Ball die Linie eines anderen, wechselt sie den Besitzer
  const byId = {};
  for (const b of alive) byId[b.id] = b;

  for (const line of lines) {
    const owner = byId[line.owner];
    const ox = owner ? owner.x : line.ax;
    const oy = owner ? owner.y : line.ay;

    for (const b of alive) {
      if (b.id === line.owner) continue;
      const d = pointToSegmentDist(b.x, b.y, line.ax, line.ay, ox, oy);
      if (d <= b.r + CAPTURE_MARGIN) {
        line.owner = b.id;
        break;
      }
    }
  }

  // Sterbe-Check: 0 Linien = tot
  const lineCounts = {};
  for (const b of balls) lineCounts[b.id] = 0;
  for (const line of lines) lineCounts[line.owner]++;

  for (const b of balls) {
    if (b.alive && lineCounts[b.id] === 0) {
      b.alive = false;
      playDeathSound();
    }
  }

  const remaining = balls.filter(b => b.alive);

  // 70-Sekunden-Gesamtlimit: steht bis dahin kein Sieger fest, wird zufällig einer bestimmt
  if (!finished && remaining.length > 1 && gameStartTime !== null && Date.now() - gameStartTime >= TOTAL_TIME_LIMIT) {
    const winner = remaining[Math.floor(Math.random() * remaining.length)];
    declareWinner(winner);
    return;
  }

  if (remaining.length === 1 && !finished) {
    declareWinner(remaining[0]);
  } else if (remaining.length === 0 && !finished) {
    finished = true;
    statusEl.textContent = 'All balls have been eliminated!';
    statusEl.style.color = '#fff';
  } else if (!finished) {
    statusEl.textContent = `Still in the race: ${remaining.length}`;
    statusEl.style.color = '#fff';
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Kreis
  ctx.beginPath();
  ctx.arc(circle.cx, circle.cy, circle.r, 0, Math.PI * 2);
  if (finished && winnerColor) {
    ctx.strokeStyle = winnerColor;
    ctx.lineWidth = 6;
    ctx.shadowColor = winnerColor;
    ctx.shadowBlur = 45;
    ctx.stroke();
    ctx.shadowBlur = 0;
  } else {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  const byId = {};
  for (const b of balls) byId[b.id] = b;

  // Linien
  ctx.lineWidth = 1;
  for (const line of lines) {
    const owner = byId[line.owner];
    if (!owner || !owner.alive) continue;
    ctx.beginPath();
    ctx.moveTo(line.ax, line.ay);
    ctx.lineTo(owner.x, owner.y);
    ctx.strokeStyle = `hsla(${owner.hue}, 85%, 60%, 0.4)`;
    ctx.stroke();
  }

  // Bälle
  for (const b of balls) {
    if (!b.alive) continue;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.getElementById('wrap').insertAdjacentHTML('beforeend',
  '<button id="restart">Neu starten</button>');
document.getElementById('restart').addEventListener('click', init);
</script>
</body>
</html>
