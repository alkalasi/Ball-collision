<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bitcoin Ball vs Gold Ball (pro Kilo)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 210;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_CHECKER_Y0 = TOP_ARENA_Y1 + BAR_H * 3;
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_CHECKER_Y0 = BOT_ARENA_Y1 + BAR_H * 3;
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Farben
const TOP_COLOR = '#F7931A';  // Bitcoin Ball
const TOP_TEXT  = '#E07B00';
const BOT_COLOR = '#D4A017';  // Gold Ball
const BOT_TEXT  = '#A67C00';

// Jeder Ball hat 3 Balken (HP), der Boden ist immer der aktive Balken. Wer zuerst alle 3 durchbricht
// und die Ziellinie (Schachbrett) berührt, gewinnt.
const BAR_HEALTHS = [1000, 500000, 4000000];

// Identische Physik für beide Bälle (~1,2 s pro Bodenkontakt -> 63 Treffer = ~75 s)
const GRAVITY = 0.22;
const MAX_FALL_SPEED = 30;
const BOUNCE_VY = 7.8;
const BALL_SPEED = 3.2;

// Echte Daten: Durchschnittspreis pro Monat in USD, Jan 2021 bis Mär 2026 (1 Treffer = 1 Monat)
// Bitcoin: Mittel der täglichen Schlusskurse (Coin Metrics, PriceUSD), Preis pro 1 BTC
// Gold: Monatspreis pro Feinunze (datasets/gold-prices) x 32,1507 = Preis pro 1 KILO (Kilobarren)
const MONTHS = [
  'Jan 2021', 'Feb 2021', 'Mar 2021', 'Apr 2021', 'May 2021', 'Jun 2021', 'Jul 2021', 'Aug 2021',
  'Sep 2021', 'Oct 2021', 'Nov 2021', 'Dec 2021', 'Jan 2022', 'Feb 2022', 'Mar 2022', 'Apr 2022',
  'May 2022', 'Jun 2022', 'Jul 2022', 'Aug 2022', 'Sep 2022', 'Oct 2022', 'Nov 2022', 'Dec 2022',
  'Jan 2023', 'Feb 2023', 'Mar 2023', 'Apr 2023', 'May 2023', 'Jun 2023', 'Jul 2023', 'Aug 2023',
  'Sep 2023', 'Oct 2023', 'Nov 2023', 'Dec 2023', 'Jan 2024', 'Feb 2024', 'Mar 2024', 'Apr 2024',
  'May 2024', 'Jun 2024', 'Jul 2024', 'Aug 2024', 'Sep 2024', 'Oct 2024', 'Nov 2024', 'Dec 2024',
  'Jan 2025', 'Feb 2025', 'Mar 2025', 'Apr 2025', 'May 2025', 'Jun 2025', 'Jul 2025', 'Aug 2025',
  'Sep 2025', 'Oct 2025', 'Nov 2025', 'Dec 2025', 'Jan 2026', 'Feb 2026', 'Mar 2026'
];
const BTC_PRICES = [
  34753, 46316, 54933, 57105, 46507, 35812, 34412, 45747,
  45927, 57915, 60685, 49357, 41113, 40756, 41974, 41441,
  31707, 24353, 21545, 22362, 19793, 19648, 17580, 16937,
  20240, 23303, 25123, 28856, 27516, 27761, 30050, 27845,
  26306, 29749, 36605, 42548, 42912, 49873, 67712, 65915,
  65256, 65903, 62838, 59963, 60338, 65583, 86569, 98247,
  100008, 95251, 85064, 86436, 103629, 105807, 115354, 114846,
  113171, 114120, 96282, 88916, 90478, 68855, 69533
];
const GOLD_PRICES = [
  60025, 58129, 55235, 56585, 59479, 58997, 58129, 57389,
  57068, 57132, 58579, 57550, 58386, 59672, 62630, 62276,
  59447, 59061, 55717, 56746, 54045, 53499, 55460, 57807,
  61022, 59640, 61504, 64301, 64044, 62469, 62726, 61697,
  61601, 61601, 63787, 65137, 65395, 65041, 69381, 74943,
  75586, 74783, 77097, 79412, 82660, 86486, 85232, 85135,
  87129, 93076, 95906, 103461, 106387, 107801, 107383, 108284,
  117929, 130478, 131400, 138538, 152812, 161397, 156124
];
const YEARS = BTC_PRICES.length; // Anzahl Monate = Anzahl Treffer
const BTC_TOTAL  = BTC_PRICES.reduce((a, b) => a + b, 0);
const GOLD_TOTAL = GOLD_PRICES.reduce((a, b) => a + b, 0);
function formatUsd(v) {
  if (v < 100) return '$' + v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return '$' + Math.round(v).toLocaleString('de-DE');
}
function formatK(v) {
  if (v >= 1000000) return '$' + (v / 1000000).toFixed(2) + 'M';
  return v >= 1000 ? '$' + (v / 1000).toFixed(1) + 'K' : '$' + Math.round(v);
}

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function topHitSound(n) { beep(320 + n * 8, 0.16, 'triangle', 0.14); }
function botHitSound(n) { beep(220 + n * 5, 0.16, 'sine', 0.14); }

function applyDamage(bars, dmg) {
  for (let i = 0; i < bars.length; i++) {
    if (bars[i] > 0) {
      bars[i] -= dmg;
      if (bars[i] < 0) bars[i] = 0;
      return;
    }
  }
}
function isFullyDepleted(bars) { return bars.every(h => h <= 0); }
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

let topBall, botBall, topBars, botBars, topHitCount, botHitCount, topDamage, botDamage;
let popups, started, gameOver, winner, currentMonth;

function init() {
  const dirT = Math.random() < 0.5 ? -1 : 1;
  topBall = { x: W / 2, y: TOP_ARENA_Y0 + ARENA_H / 2, vx: dirT * BALL_SPEED, vy: 0, r: 18 };
  const dirB = Math.random() < 0.5 ? -1 : 1;
  botBall = { x: W / 2, y: BOT_ARENA_Y0 + ARENA_H / 2, vx: dirB * BALL_SPEED, vy: 0, r: 18 };
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  topHitCount = 0;
  botHitCount = 0;
  topDamage = 0;
  botDamage = 0;
  popups = [];
  gameOver = false;
  winner = null;
  started = false;
  currentMonth = null;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, side) {
  popups.push({ x: Math.max(52, Math.min(W - 52, x)), y, text, side, age: 0 });
}

// true = Bodenkontakt (Bounce/Ziellinie entscheidet der Aufrufer)
function stepBall(ball, x0, x1, y0, y1) {
  ball.vy += GRAVITY;
  if (ball.vy > MAX_FALL_SPEED) ball.vy = MAX_FALL_SPEED;
  ball.x += ball.vx;
  ball.y += ball.vy;
  if (ball.x - ball.r < x0) { ball.x = x0 + ball.r; ball.vx *= -1; }
  if (ball.x + ball.r > x1) { ball.x = x1 - ball.r; ball.vx *= -1; }
  if (ball.y - ball.r < y0) { ball.y = y0 + ball.r; ball.vy *= -1; }
  if (ball.y + ball.r > y1) { ball.y = y1 - ball.r; return true; }
  return false;
}

function finish(side) {
  if (!gameOver) { gameOver = true; winner = side; }
}

function update() {
  if (!started) return;

  if (!gameOver) {
    // Oben: Bitcoin Ball
    const topFloor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
    if (stepBall(topBall, 12, W - 12, TOP_ARENA_Y0 + 10, topFloor - 10)) {
      if (!isFullyDepleted(topBars)) {
        topBall.vy = -BOUNCE_VY;
        if (topHitCount < BTC_PRICES.length) {
          const dmg = BTC_PRICES[topHitCount];
          topHitCount++;
          currentMonth = MONTHS[topHitCount - 1];
          topDamage += dmg;
          applyDamage(topBars, dmg);
          addPopup(topBall.x, topBall.y, '-' + formatUsd(dmg), 'top');
          topHitSound(topHitCount);
        }
      } else {
        topBall.vy = 0;
        finish('top');
      }
    }

    // Unten: Gold Ball
    const botFloor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
    if (stepBall(botBall, 12, W - 12, BOT_ARENA_Y0 + 10, botFloor - 10)) {
      if (!isFullyDepleted(botBars)) {
        botBall.vy = -BOUNCE_VY;
        if (botHitCount < GOLD_PRICES.length) {
          const dmg = GOLD_PRICES[botHitCount];
          botHitCount++;
          botDamage += dmg;
          applyDamage(botBars, dmg);
          addPopup(botBall.x, botBall.y, '-' + formatUsd(dmg), 'bot');
          botHitSound(botHitCount);
        }
      } else {
        botBall.vy = 0;
        finish('bot');
      }
    }

    // Daten aufgebraucht, keiner durch: wer weniger Rest-HP hat, gewinnt
    if (!gameOver && topHitCount >= YEARS && botHitCount >= YEARS) {
      const restTop = topBars.reduce((a, b) => a + b, 0);
      const restBot = botBars.reduce((a, b) => a + b, 0);
      finish(restTop <= restBot ? 'top' : 'bot');
    }
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }
}

function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}
function drawBall(ball, color, label) {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '900 ' + Math.round(ball.r * (label.length > 1 ? 0.95 : 1.2)) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, ball.x, ball.y + 1);
}
function drawPopups(side, color) {
  for (const p of popups) {
    if (p.side !== side) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.font = 'bold 15px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(p.text, p.x, p.y - p.age * 0.6);
    ctx.fillStyle = color;
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
}
function drawHealthBar(y0, y1, color, hp, maxHp) {
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.fillStyle = color;
  ctx.fillRect(0, y0, W * Math.max(0, hp) / maxHp, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  const txt = Math.max(0, Math.round(hp)).toLocaleString('de-DE');
  ctx.strokeText(txt, W / 2, (y0 + y1) / 2 + 1);
  ctx.fillStyle = '#fff';
  ctx.fillText(txt, W / 2, (y0 + y1) / 2 + 1);
}

function drawSide(o) {
  ctx.fillStyle = o.text;
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(o.title, W / 2, (o.labelY0 + o.labelY1) / 2);

  const active = getActiveBarIndex(o.bars);
  const floorY = o.arenaY1 + active * BAR_H;
  drawArenaBg(o.arenaY0, floorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, o.arenaY0, W, floorY - o.arenaY0);
  ctx.clip();
  drawBall(o.ball, o.color, o.symbol);
  drawPopups(o.side, o.color);
  ctx.restore();

  for (let i = active; i < o.bars.length; i++) {
    const y0 = floorY + (i - active) * BAR_H;
    drawHealthBar(y0, y0 + BAR_H, o.text, o.bars[i], BAR_HEALTHS[i]);
  }
  drawChecker(o.checkerY0, o.checkerY1);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  drawSide({
    title: 'BITCOIN BALL', text: TOP_TEXT, color: TOP_COLOR, symbol: 'B', side: 'top',
    ball: topBall, bars: topBars,
    labelY0: TOP_LABEL_Y0, labelY1: TOP_LABEL_Y1,
    arenaY0: TOP_ARENA_Y0, arenaY1: TOP_ARENA_Y1,
    checkerY0: TOP_CHECKER_Y0, checkerY1: TOP_CHECKER_Y1,
  });

  // VS-Band: Erklärung links, VS mittig, aktueller Monat rechts
  const vsMid = (VS_Y0 + VS_Y1) / 2;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = 'bold 10px Arial';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText('DAMAGE = AVG. MONTHLY PRICE (USD)', 12, vsMid);
  ctx.textAlign = 'center';
  ctx.font = '900 22px Arial';
  ctx.fillStyle = '#111';
  ctx.fillText('VS', W / 2 + 20, vsMid);
  ctx.textAlign = 'right';
  ctx.font = '900 20px Arial';
  ctx.fillText(currentMonth || '', W - 12, vsMid);

  drawSide({
    title: 'GOLD BALL (PER KG)', text: BOT_TEXT, color: BOT_COLOR, symbol: 'Au', side: 'bot',
    ball: botBall, bars: botBars,
    labelY0: BOT_LABEL_Y0, labelY1: BOT_LABEL_Y1,
    arenaY0: BOT_ARENA_Y0, arenaY1: BOT_ARENA_Y1,
    checkerY0: BOT_CHECKER_Y0, checkerY1: BOT_CHECKER_Y1,
  });

  if (gameOver) {
    const top = winner === 'top';
    const y0 = top ? TOP_ARENA_Y0 : BOT_ARENA_Y0;
    const y1 = top ? TOP_CHECKER_Y0 : BOT_CHECKER_Y0;
    const winDmg = top ? topDamage : botDamage;
    const loseDmg = top ? botDamage : topDamage;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, y0, W, y1 - y0);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 26px Arial';
    ctx.fillText((top ? 'BITCOIN' : 'GOLD') + ' BALL WINS', W / 2, (y0 + y1) / 2 - 14);
    ctx.font = 'bold 15px Arial';
    ctx.fillText(formatK(winDmg) + ' vs ' + formatK(loseDmg) + ' total damage', W / 2, (y0 + y1) / 2 + 16);
  }
}

// Fester Zeitschritt: Videolänge unabhängig von der Bildwiederholrate (60/120 Hz)
const STEP_MS = 1000 / 60;
let lastT = 0, acc = 0;
function loop(t) {
  if (!lastT) lastT = t;
  acc += Math.min(t - lastT, 100);
  lastT = t;
  while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
