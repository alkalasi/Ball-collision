<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Poison Ball vs Infernonacci Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 210;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_CHECKER_Y0 = TOP_ARENA_Y1 + BAR_H * 3;
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_CHECKER_Y0 = BOT_ARENA_Y1 + BAR_H * 3;
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Farben
const TOP_COLOR = '#9B59D0';  // Poison Ball - Violett
const BOT_COLOR = '#2BD9B9';  // Infernonacci Ball - Türkis

// Beide Bälle haben 3 Balken (HP), der Boden ist immer der aktive Balken.
const BAR_HEALTHS = [1000, 10000000000, 1000000000000000];

// Identische Physik für beide Bälle (normaler Bounce)
const GRAVITY = 0.22;
const MAX_FALL_SPEED = 30;
const BOUNCE_VY = 9;
const BALL_SPEED = 3.2;

function formatNum(v) {
  return Math.round(v).toLocaleString('de-DE');
}
function formatRate(v) {
  return v < 10
    ? v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : formatNum(v);
}

// ===== Poison Ball: Gift-Stacks =====
// Jeder Bodenkontakt macht nur kleinen Direktschaden, fügt aber einen Gift-Stack hinzu.
// Jeder neue Stack ist POISON_GROWTH-mal stärker als der vorherige und tickt ab dann bis zum Ende weiter.
const POISON_BASE = 0.03;   // Stärke von Stack 1 (Schaden/Sek.)
const POISON_GROWTH = 1.9;  // jeder weitere Stack ist so viel mal stärker
const DIRECT_PER_HIT = 2;   // Direktschaden pro Treffer = DIRECT_PER_HIT * Trefferzahl

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function poisonHitSound(n) { beep(190 + n * 5, 0.13, 'square', 0.07); }

let infernoHumOsc = null, infernoHumGain = null;
function startInfernoHum() {
  if (!audioCtx || infernoHumOsc) return;
  infernoHumOsc = audioCtx.createOscillator();
  infernoHumGain = audioCtx.createGain();
  infernoHumOsc.type = 'sawtooth';
  infernoHumOsc.frequency.setValueAtTime(90, audioCtx.currentTime);
  infernoHumGain.gain.setValueAtTime(0.045, audioCtx.currentTime);
  infernoHumOsc.connect(infernoHumGain);
  infernoHumGain.connect(audioCtx.destination);
  infernoHumOsc.start();
}
function stopInfernoHum() {
  if (infernoHumGain && audioCtx) infernoHumGain.gain.setValueAtTime(0, audioCtx.currentTime);
}

function applyDamage(bars, dmg) {
  let remaining = dmg;
  for (let i = 0; i < bars.length && remaining > 0; i++) {
    if (bars[i] > 0) {
      const take = Math.min(bars[i], remaining);
      bars[i] -= take;
      remaining -= take;
    }
  }
}
function isFullyDepleted(bars) { return bars.every(h => h <= 0); }
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

function fibonacci(n) {
  let a = 1, b = 1;
  if (n <= 2) return 1;
  for (let i = 3; i <= n; i++) {
    const c = a + b;
    a = b;
    b = c;
  }
  return b;
}

let topBall, botBall, topBars, botBars, topHitCount, botHitCount, infernoSec;
let popups, bubbles, started, gameOver, winner, beamFlicker, sparkPhase;

function init() {
  const tAngle = Math.random() * Math.PI * 2;
  topBall = {
    x: W / 2, y: TOP_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(tAngle) * BALL_SPEED, vy: Math.sin(tAngle) * BALL_SPEED,
    r: 16,
  };
  const bAngle = Math.random() * Math.PI * 2;
  botBall = {
    x: W / 2, y: BOT_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(bAngle) * BALL_SPEED, vy: Math.sin(bAngle) * BALL_SPEED,
    r: 17,
  };
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  topHitCount = 0;
  botHitCount = 0;
  infernoSec = 0;
  popups = [];
  bubbles = [];
  gameOver = false;
  winner = null;
  started = false;
  beamFlicker = 0;
  sparkPhase = 0;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  startInfernoHum();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, color) {
  popups.push({ x: Math.max(40, Math.min(W - 40, x)), y, text, color, age: 0 });
}

function poisonDirect(n) { return DIRECT_PER_HIT * n; }
// Summe aller Stacks: Stack i hat Stärke POISON_BASE * GROWTH^(i-1)
function poisonRate(n) {
  if (n <= 0) return 0;
  return POISON_BASE * (Math.pow(POISON_GROWTH, n) - 1) / (POISON_GROWTH - 1);
}
function infernoBeamRate() { return fibonacci(Math.floor(infernoSec) + 1); } // springt jede Sekunde zur nächsten Fibonacci-Zahl

function finish(side) {
  if (!gameOver) { gameOver = true; winner = side; stopInfernoHum(); }
}

function spawnBubble(x, y, big) {
  if (bubbles.length > 140) return;
  bubbles.push({
    x: x + (Math.random() - 0.5) * 14, y: y + (Math.random() - 0.5) * 10,
    vx: (Math.random() - 0.5) * (big ? 2.4 : 0.5),
    vy: big ? -Math.random() * 2.2 - 0.4 : -Math.random() * 0.8 - 0.3,
    r: big ? 2 + Math.random() * 3 : 1.5 + Math.random() * 2.5,
    age: 0, life: big ? 34 : 46 + Math.random() * 20,
  });
}

function update() {
  if (!started || gameOver) return;

  sparkPhase += 0.08;
  infernoSec += 1 / 60;

  // Oben: Poison Ball - normaler Bounce, kleiner Direktschaden + neuer Gift-Stack pro Treffer,
  // alle Stacks ticken durchgehend weiter
  if (!isFullyDepleted(topBars)) {
    const topFloor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
    const tx0 = 12, tx1 = W - 12, ty0 = TOP_ARENA_Y0 + 10, ty1 = topFloor - 10;
    topBall.vy += GRAVITY;
    if (topBall.vy > MAX_FALL_SPEED) topBall.vy = MAX_FALL_SPEED;
    topBall.x += topBall.vx;
    topBall.y += topBall.vy;
    if (topBall.x - topBall.r < tx0) { topBall.x = tx0 + topBall.r; topBall.vx *= -1; }
    if (topBall.x + topBall.r > tx1) { topBall.x = tx1 - topBall.r; topBall.vx *= -1; }
    if (topBall.y - topBall.r < ty0) { topBall.y = ty0 + topBall.r; topBall.vy *= -1; }
    if (topBall.y + topBall.r > ty1) {
      topBall.y = ty1 - topBall.r;
      topBall.vy = -BOUNCE_VY;
      topHitCount++;
      const dmg = poisonDirect(topHitCount);
      applyDamage(topBars, dmg);
      addPopup(topBall.x, topBall.y - 6, '-' + formatNum(dmg), TOP_COLOR);
      addPopup(topBall.x, topBall.y - 24, '+1 STACK', '#6BCB3B');
      poisonHitSound(topHitCount);
      for (let i = 0; i < 7; i++) spawnBubble(topBall.x, topBall.y + topBall.r * 0.6, true);
    }

    if (topHitCount > 0) {
      applyDamage(topBars, poisonRate(topHitCount) / 60);
      if (Math.random() < Math.min(0.85, 0.06 + topHitCount * 0.02)) spawnBubble(topBall.x, topBall.y, false);
    }
    if (isFullyDepleted(topBars)) finish('top');
  }

  // Unten: Infernonacci Ball - springt normal, feuert durchgehend einen Beam (Fibonacci-Schaden pro Sekunde)
  if (!isFullyDepleted(botBars)) {
    const botFloor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
    const bx0 = 12, bx1 = W - 12, by0 = BOT_ARENA_Y0 + 10, by1 = botFloor - 10;
    botBall.vy += GRAVITY;
    if (botBall.vy > MAX_FALL_SPEED) botBall.vy = MAX_FALL_SPEED;
    botBall.x += botBall.vx;
    botBall.y += botBall.vy;
    if (botBall.x - botBall.r < bx0) { botBall.x = bx0 + botBall.r; botBall.vx *= -1; }
    if (botBall.x + botBall.r > bx1) { botBall.x = bx1 - botBall.r; botBall.vx *= -1; }
    if (botBall.y - botBall.r < by0) { botBall.y = by0 + botBall.r; botBall.vy *= -1; }
    if (botBall.y + botBall.r > by1) {
      botBall.y = by1 - botBall.r;
      botBall.vy = -BOUNCE_VY;
      botHitCount++;
    }

    applyDamage(botBars, infernoBeamRate() / 60);
    beamFlicker = 1;
    if (isFullyDepleted(botBars)) finish('bot');
  }
  beamFlicker = Math.max(0, beamFlicker - 0.03);

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.age++;
    b.x += b.vx;
    b.y += b.vy;
    b.vy += 0.012;
    if (b.age > b.life) bubbles.splice(i, 1);
  }
}

function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}
function drawHealthBar(y0, y1, bg, health) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  ctx.fillStyle = bg;
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.fillStyle = '#111';
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(formatNum(health), W / 2, (y0 + y1) / 2);
}
function drawSideBars(bars, arenaY1orig, color) {
  const activeIdx = getActiveBarIndex(bars);
  const floor = arenaY1orig + activeIdx * BAR_H;
  for (let i = activeIdx; i < bars.length; i++) {
    const y0 = floor + (i - activeIdx) * BAR_H;
    drawHealthBar(y0, y0 + BAR_H, color, bars[i]);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  // ===== Top: Poison Ball =====
  ctx.fillStyle = TOP_COLOR;
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('POISON BALL', W / 2, LABEL_H / 2);

  const topActiveIdx = getActiveBarIndex(topBars);
  const topFloorY = TOP_ARENA_Y1 + topActiveIdx * BAR_H;
  drawArenaBg(TOP_ARENA_Y0, topFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TOP_ARENA_Y0, W, topFloorY - TOP_ARENA_Y0);
  ctx.clip();

  ctx.textAlign = 'left';
  ctx.font = 'bold 11px Arial';
  ctx.fillStyle = TOP_COLOR;
  ctx.fillText(
    'POISON: ' + formatRate(poisonRate(topHitCount)) + '/s',
    12, TOP_ARENA_Y0 + 14
  );

  if (!isFullyDepleted(topBars)) {
    // Giftige Aura (wird mit den Stacks dichter)
    const stackGlow = Math.min(1, topHitCount / 30);
    const gr = topBall.r * (1.9 + stackGlow * 1.2);
    const aura = ctx.createRadialGradient(topBall.x, topBall.y, 2, topBall.x, topBall.y, gr);
    aura.addColorStop(0, 'rgba(120,200,60,' + (0.28 + stackGlow * 0.3) + ')');
    aura.addColorStop(1, 'rgba(120,200,60,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(topBall.x, topBall.y, gr, 0, Math.PI * 2);
    ctx.fill();
  }

  // Gift-Blasen
  for (const b of bubbles) {
    const a = Math.max(0, 1 - b.age / b.life);
    ctx.globalAlpha = a * 0.85;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = '#7ED321';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(40,90,10,0.8)';
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (!isFullyDepleted(topBars)) {
    ctx.beginPath();
    ctx.arc(topBall.x, topBall.y, topBall.r, 0, Math.PI * 2);
    ctx.fillStyle = TOP_COLOR;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000';
    ctx.stroke();
    // kleine grüne Gift-Tropfen auf dem Ball
    ctx.fillStyle = '#7ED321';
    ctx.beginPath(); ctx.arc(topBall.x - 5, topBall.y - 4, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(topBall.x + 5, topBall.y + 2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(topBall.x - 1, topBall.y + 6, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of popups) {
    if (p.color === BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = p.color;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.strokeText(p.text, p.x, p.y - p.age * 0.6);
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawSideBars(topBars, TOP_ARENA_Y1, TOP_COLOR);
  drawChecker(TOP_CHECKER_Y0, TOP_CHECKER_Y1);

  // VS
  ctx.fillStyle = '#111';
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  // ===== Bottom: Infernonacci Ball =====
  ctx.fillStyle = BOT_COLOR;
  ctx.font = '900 22px Arial';
  ctx.fillText('INFERNONACCI BALL', W / 2, (BOT_LABEL_Y0 + BOT_LABEL_Y1) / 2);

  const botActiveIdx = getActiveBarIndex(botBars);
  const botFloorY = BOT_ARENA_Y1 + botActiveIdx * BAR_H;
  drawArenaBg(BOT_ARENA_Y0, botFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, BOT_ARENA_Y0, W, botFloorY - BOT_ARENA_Y0);
  ctx.clip();

  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = BOT_COLOR;
  ctx.fillText('BEAM: ' + formatNum(infernoBeamRate()) + '/s', 12, BOT_ARENA_Y0 + 14);

  if (!isFullyDepleted(botBars)) {
    // Beam-Strahl nach unten bis zum Boden der eigenen Arena
    const grad = ctx.createLinearGradient(0, botBall.y, 0, botFloorY);
    grad.addColorStop(0, BOT_COLOR + 'ff');
    grad.addColorStop(1, BOT_COLOR + '10');
    ctx.save();
    ctx.globalAlpha = 0.55 + beamFlicker * 0.3;
    ctx.fillStyle = grad;
    ctx.fillRect(botBall.x - 4, botBall.y, 8, botFloorY - botBall.y);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff';
    ctx.fillRect(botBall.x - 1.3, botBall.y, 2.6, botFloorY - botBall.y);
    ctx.restore();
  }

  if (!isFullyDepleted(botBars)) {
    // Glüh-Aura
    const glow = ctx.createRadialGradient(botBall.x, botBall.y, 2, botBall.x, botBall.y, botBall.r * 2.4);
    glow.addColorStop(0, BOT_COLOR + 'aa');
    glow.addColorStop(1, BOT_COLOR + '00');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(botBall.x, botBall.y, botBall.r * 2.4, 0, Math.PI * 2);
    ctx.fill();

    // Funken-Strahlen rundherum
    ctx.strokeStyle = BOT_COLOR;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + sparkPhase * 0.5;
      const r0 = botBall.r + 3, r1 = botBall.r + 9 + Math.sin(sparkPhase * 2 + i) * 3;
      ctx.beginPath();
      ctx.moveTo(botBall.x + Math.cos(a) * r0, botBall.y + Math.sin(a) * r0);
      ctx.lineTo(botBall.x + Math.cos(a) * r1, botBall.y + Math.sin(a) * r1);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(botBall.x, botBall.y, botBall.r, 0, Math.PI * 2);
    ctx.fillStyle = BOT_COLOR;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000';
    ctx.stroke();
  }

  for (const p of popups) {
    if (p.color !== BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = BOT_COLOR;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawSideBars(botBars, BOT_ARENA_Y1, BOT_COLOR);
  drawChecker(BOT_CHECKER_Y0, BOT_CHECKER_Y1);

  if (gameOver) {
    const top = winner === 'top';
    const y0 = top ? TOP_ARENA_Y0 : BOT_ARENA_Y0;
    const y1 = top ? TOP_CHECKER_Y0 : BOT_CHECKER_Y0;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, y0, W, y1 - y0);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 24px Arial';
    ctx.fillText((top ? 'POISON' : 'INFERNONACCI') + ' BALL WINS', W / 2, (y0 + y1) / 2);
  }
}

// Fester Zeitschritt: Videolänge unabhängig von der Bildwiederholrate (60/120 Hz)
const STEP_MS = 1000 / 60;
let lastT = 0, acc = 0;
function loop(t) {
  if (!lastT) lastT = t;
  acc += Math.min(t - lastT, 100);
  lastT = t;
  while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
