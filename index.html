<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Male Ball vs Female Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K dr\u00fccken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 210;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_BAR_Y0 = [TOP_ARENA_Y1, TOP_ARENA_Y1 + BAR_H, TOP_ARENA_Y1 + BAR_H * 2];
const TOP_BAR_Y1 = TOP_BAR_Y0.map(y => y + BAR_H);
const TOP_CHECKER_Y0 = TOP_BAR_Y1[2];
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_BAR_Y0 = [BOT_ARENA_Y1, BOT_ARENA_Y1 + BAR_H, BOT_ARENA_Y1 + BAR_H * 2];
const BOT_BAR_Y1 = BOT_BAR_Y0.map(y => y + BAR_H);
const BOT_CHECKER_Y0 = BOT_BAR_Y1[2];
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

const BAR_HEALTHS = [1000, 10000000000, 1000000000000000];
const TOP_COLOR = '#0A2A66';  // Mbappe Ball - Frankreich Blau
const BOT_COLOR = '#A50044';  // Yamal Ball - Barca Granat
const GRAVITY = 0.22;
const MAX_FALL_SPEED = 30;
const BOUNCE_VY = 9;
const SLOWDOWN = 0.8;
const MIN_SLOWMO = 0.01;
const BALL_SPEED = 3.2;

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function topHitSound(n) { beep(300 + n * 6, 0.16, 'triangle', 0.14); }
function botHitSound(n) { beep(220 + n * 5, 0.16, 'sine', 0.14); }

introSound.preload = 'auto';
introSound.volume = 1;

let topBall, botBall, topBars, botBars, topHitCount, botHitCount, popups, gameOver, started;

function fibonacci(n) {
  let a = 1, b = 1;
  if (n <= 2) return 1;
  for (let i = 3; i <= n; i++) {
    const c = a + b;
    a = b;
    b = c;
  }
  return b;
}
function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}
function doubling(n) {
  if (n <= 1) return 1;
  return Math.pow(2, n - 1);
}
function jordanDamage(n) {
  return 32292 * Math.pow(6, Math.floor((n - 1) / 5));
}
function lebronDamage(n) {
  return 43440 * Math.pow(4, Math.floor((n - 1) / 5));
}

function applyDamage(bars, dmg) {
  for (let i = 0; i < bars.length; i++) {
    if (bars[i] > 0) {
      bars[i] -= dmg;
      if (bars[i] < 0) bars[i] = 0;
      return;
    }
  }
}
function isFullyDepleted(bars) { return bars.every(h => h <= 0); }
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

function init() {
  const tAngle = Math.random() * Math.PI * 2;
  topBall = {
    x: W / 2,
    y: TOP_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(tAngle) * BALL_SPEED,
    vy: Math.sin(tAngle) * BALL_SPEED,
    r: 16,
    slowMult: 0.8,
  };
  const bAngle = Math.random() * Math.PI * 2;
  botBall = {
    x: W / 2,
    y: BOT_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(bAngle) * BALL_SPEED,
    vy: Math.sin(bAngle) * BALL_SPEED,
    r: 16,
  };
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  topHitCount = 0;
  botHitCount = 0;
  popups = [];
  gameOver = false;
  started = false;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  introSound.currentTime = 0;
  introSound.play().catch(() => {});
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, color) { popups.push({ x, y, text, color, age: 0 }); }

function update() {
  if (!started || gameOver) return;

  // Mbappe Ball (oben): Zeitlupen-Fakultät — springt gleich hoch, wird aber bei jedem Treffer langsamer
  const topFloor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
  const tx0 = 12, tx1 = W - 12, ty0 = TOP_ARENA_Y0 + 10, ty1 = topFloor - 10;
  topBall.vy += GRAVITY * topBall.slowMult;
  if (topBall.vy > MAX_FALL_SPEED * topBall.slowMult) topBall.vy = MAX_FALL_SPEED * topBall.slowMult;
  topBall.x += topBall.vx * topBall.slowMult;
  topBall.y += topBall.vy;
  if (topBall.x - topBall.r < tx0) { topBall.x = tx0 + topBall.r; topBall.vx *= -1; }
  if (topBall.x + topBall.r > tx1) { topBall.x = tx1 - topBall.r; topBall.vx *= -1; }
  if (topBall.y - topBall.r < ty0) { topBall.y = ty0 + topBall.r; topBall.vy *= -1; }
  if (topBall.y + topBall.r > ty1) {
    topBall.y = ty1 - topBall.r;
    if (!isFullyDepleted(topBars)) {
      topHitCount++;
      topBall.slowMult = Math.max(MIN_SLOWMO, topBall.slowMult * SLOWDOWN);
      topBall.vy = -BOUNCE_VY * Math.sqrt(topBall.slowMult);
      const dmg = factorial(topHitCount);
      applyDamage(topBars, dmg);
      addPopup(topBall.x, topBall.y, '-' + dmg.toLocaleString('de-DE'), TOP_COLOR);
      if (getActiveBarIndex(topBars) >= 1) topHitSound(topHitCount);
    } else {
      topBall.vy = 0;
      if (!gameOver) gameOver = true;
    }
  }

  // Lamine Ball (unten): normale Physik, Fibonacci-Schaden
  const botFloor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
  const bx0 = 12, bx1 = W - 12, by0 = BOT_ARENA_Y0 + 10, by1 = botFloor - 10;
  botBall.vy += GRAVITY;
  if (botBall.vy > MAX_FALL_SPEED) botBall.vy = MAX_FALL_SPEED;
  botBall.x += botBall.vx;
  botBall.y += botBall.vy;
  if (botBall.x - botBall.r < bx0) { botBall.x = bx0 + botBall.r; botBall.vx *= -1; }
  if (botBall.x + botBall.r > bx1) { botBall.x = bx1 - botBall.r; botBall.vx *= -1; }
  if (botBall.y - botBall.r < by0) { botBall.y = by0 + botBall.r; botBall.vy *= -1; }
  if (botBall.y + botBall.r > by1) {
    botBall.y = by1 - botBall.r;
    if (!isFullyDepleted(botBars)) {
      botBall.vy = -BOUNCE_VY;
      botHitCount++;
      const dmg = fibonacci(botHitCount);
      applyDamage(botBars, dmg);
      addPopup(botBall.x, botBall.y, '-' + dmg.toLocaleString('de-DE'), BOT_COLOR);
      botHitSound(botHitCount);
    } else {
      botBall.vy = 0;
      if (!gameOver) {
        gameOver = true;
        beep(180, 0.5, 'sawtooth', 0.18);
      }
    }
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }
}

function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}

function drawSymbolBall(x, y, r, color, symbol) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '900 ' + Math.round(r * 1.3) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(symbol, x, y + 1);
}

function drawHealthBar(y0, y1, bg, health) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  ctx.fillStyle = bg;
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.fillStyle = '#fff';
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.max(0, Math.round(health)).toLocaleString('de-DE'), W / 2, (y0 + y1) / 2);
}
function drawSideBars(bars, arenaY1orig, color) {
  const activeIdx = getActiveBarIndex(bars);
  const floor = arenaY1orig + activeIdx * BAR_H;
  for (let i = activeIdx; i < bars.length; i++) {
    const y0 = floor + (i - activeIdx) * BAR_H;
    drawHealthBar(y0, y0 + BAR_H, color, bars[i]);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = TOP_COLOR;
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('MBAPPE BALL', W / 2, LABEL_H / 2);

  const topActiveIdx = getActiveBarIndex(topBars);
  const topFloorY = TOP_ARENA_Y1 + topActiveIdx * BAR_H;
  drawArenaBg(TOP_ARENA_Y0, topFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TOP_ARENA_Y0, W, topFloorY - TOP_ARENA_Y0);
  ctx.clip();
  drawSymbolBall(topBall.x, topBall.y, topBall.r, TOP_COLOR, '10');
  for (const p of popups) {
    if (p.color !== TOP_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = TOP_COLOR;
    ctx.font = 'bold 14px Arial';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = TOP_COLOR;
  ctx.fillText('DAMAGE: ' + factorial(topHitCount + 1).toLocaleString('de-DE'), 12, TOP_ARENA_Y0 + 14);

  drawSideBars(topBars, TOP_ARENA_Y1, TOP_COLOR);
  drawChecker(TOP_CHECKER_Y0, TOP_CHECKER_Y1);

  ctx.fillStyle = '#111';
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  ctx.fillStyle = BOT_COLOR;
  ctx.font = '900 20px Arial';
  ctx.fillText('LAMINE BALL', W / 2, (BOT_LABEL_Y0 + BOT_LABEL_Y1) / 2);

  const botActiveIdx = getActiveBarIndex(botBars);
  const botFloorY = BOT_ARENA_Y1 + botActiveIdx * BAR_H;
  drawArenaBg(BOT_ARENA_Y0, botFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, BOT_ARENA_Y0, W, botFloorY - BOT_ARENA_Y0);
  ctx.clip();
  drawSymbolBall(botBall.x, botBall.y, botBall.r, BOT_COLOR, '19');
  for (const p of popups) {
    if (p.color !== BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = BOT_COLOR;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = BOT_COLOR;
  ctx.fillText('DAMAGE: ' + fibonacci(botHitCount + 1).toLocaleString('de-DE'), 12, BOT_ARENA_Y0 + 14);

  drawSideBars(botBars, BOT_ARENA_Y1, BOT_COLOR);
  drawChecker(BOT_CHECKER_Y0, BOT_CHECKER_Y1);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
