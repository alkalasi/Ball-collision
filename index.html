<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fibonacci Boss vs Factorial Swarm</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #e9ddc4; overflow: hidden; height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); color: #fff; font-size: clamp(18px, 4.5vw, 26px); font-weight: 800;
    cursor: pointer; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.7); user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 420;
const BOSS_BAR_H = 40;
const MINION_BAR_H = 34;
const CHECKER_H = 14;
const ARENA_Y0 = LABEL_H, ARENA_Y1 = ARENA_Y0 + ARENA_H;
const BOSS_BAR_Y0 = ARENA_Y1, BOSS_BAR_Y1 = BOSS_BAR_Y0 + BOSS_BAR_H;
const MINION_BAR_Y0 = BOSS_BAR_Y1, MINION_BAR_Y1 = MINION_BAR_Y0 + MINION_BAR_H;
const CHECKER_Y0 = MINION_BAR_Y1, CHECKER_Y1 = CHECKER_Y0 + CHECKER_H;
const H = CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth, availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

const BOSS_HP_MAX = 1000000;
const MINION_HP_MAX = 100000;
const BOSS_COLOR = '#C9A15C';
const MINION_COLOR = '#5AA9E6';
const BALL_SPEED = 2.6;
const MINION_COUNT = 10;

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function bossHitSound(n) { beep(180 + n * 4, 0.18, 'sawtooth', 0.15); }
function minionHitSound(n) { beep(500 + n * 10, 0.1, 'triangle', 0.1); }

function fibonacci(n) {
  let a = 1, b = 1;
  if (n <= 2) return 1;
  for (let i = 3; i <= n; i++) { const c = a + b; a = b; b = c; }
  return b;
}
function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

let boss, minions, bossHp, bossHitCount, popups, gameOver, started, winner;

function init() {
  const bAngle = Math.random() * Math.PI * 2;
  boss = {
    x: W / 2, y: ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(bAngle) * BALL_SPEED, vy: Math.sin(bAngle) * BALL_SPEED,
    r: 38, hitCount: 0,
  };
  minions = [];
  for (let i = 0; i < MINION_COUNT; i++) {
    const angle = (i / MINION_COUNT) * Math.PI * 2;
    minions.push({
      x: W / 2 + Math.cos(angle) * 120,
      y: ARENA_Y0 + ARENA_H / 2 + Math.sin(angle) * 100,
      vx: Math.cos(angle + 1) * BALL_SPEED, vy: Math.sin(angle + 1) * BALL_SPEED,
      r: 15, hp: MINION_HP_MAX, hitCount: 0, alive: true, id: i + 1,
    });
  }
  bossHp = BOSS_HP_MAX;
  bossHitCount = 0;
  popups = [];
  gameOver = false;
  winner = null;
  started = false;
  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, color) { popups.push({ x, y, text, color, age: 0 }); }

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function stepBall(ball) {
  ball.x += ball.vx;
  ball.y += ball.vy;
  const x0 = 12, x1 = W - 12, y0 = ARENA_Y0 + 10, y1 = ARENA_Y1 - 10;
  if (ball.x - ball.r < x0) { ball.x = x0 + ball.r; ball.vx *= -1; }
  if (ball.x + ball.r > x1) { ball.x = x1 - ball.r; ball.vx *= -1; }
  if (ball.y - ball.r < y0) { ball.y = y0 + ball.r; ball.vy *= -1; }
  if (ball.y + ball.r > y1) { ball.y = y1 - ball.r; ball.vy *= -1; }
}

function update() {
  if (!started || gameOver) return;

  stepBall(boss);
  for (const m of minions) { if (m.alive) stepBall(m); }

  // Boss <-> Minion Kollisionen
  for (const m of minions) {
    if (!m.alive) continue;
    const d = dist(boss, m) || 1;
    if (d < boss.r + m.r) {
      const nx = (m.x - boss.x) / d, ny = (m.y - boss.y) / d;
      m.x = boss.x + nx * (boss.r + m.r);
      m.y = boss.y + ny * (boss.r + m.r);
      m.vx *= -1; m.vy *= -1;
      boss.vx = -nx * BALL_SPEED * 0.7;
      boss.vy = -ny * BALL_SPEED * 0.7;

      if (bossHp > 0) {
        bossHitCount++;
        const bossDmg = fibonacci(bossHitCount);
        m.hp -= bossDmg;
        addPopup(m.x, m.y, '-' + bossDmg.toLocaleString('de-DE'), BOSS_COLOR);
        bossHitSound(bossHitCount);
        if (m.hp <= 0) { m.alive = false; }
      }

      if (bossHp > 0) {
        m.hitCount++;
        const minionDmg = factorial(m.hitCount);
        bossHp = Math.max(0, bossHp - minionDmg);
        addPopup(boss.x, boss.y - 20, '-' + minionDmg.toLocaleString('de-DE'), MINION_COLOR);
        minionHitSound(m.hitCount);
      }
    }
  }

  // Minion <-> Minion: nur abprallen, kein Schaden
  for (let i = 0; i < minions.length; i++) {
    for (let j = i + 1; j < minions.length; j++) {
      const a = minions[i], b = minions[j];
      if (!a.alive || !b.alive) continue;
      if (dist(a, b) < a.r + b.r) {
        [a.vx, b.vx] = [b.vx, a.vx];
        [a.vy, b.vy] = [b.vy, a.vy];
      }
    }
  }

  if (bossHp <= 0 && !gameOver) { gameOver = true; winner = 'minions'; }
  if (minions.every(m => !m.alive) && !gameOver) { gameOver = true; winner = 'boss'; }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }
}

function drawArenaBg() {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, ARENA_Y0, W, ARENA_H);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.strokeRect(1.5, ARENA_Y0 + 1.5, W - 3, ARENA_H - 3);
}
function drawChecker(y0, y1) {
  const sq = 12; let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawBossBar() {
  const alive = bossHp > 0;
  ctx.fillStyle = alive ? BOSS_COLOR : '#e9ddc4';
  ctx.fillRect(0, BOSS_BAR_Y0, W, BOSS_BAR_H);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.strokeRect(1, BOSS_BAR_Y0 + 1, W - 2, BOSS_BAR_H - 2);
  if (alive) {
    ctx.fillStyle = '#fff'; ctx.font = '900 18px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('BOSS: ' + Math.max(0, Math.round(bossHp)).toLocaleString('de-DE'), W / 2, BOSS_BAR_Y0 + BOSS_BAR_H / 2);
  }
}
function drawMinionBars() {
  const n = minions.length;
  const segW = W / n;
  for (let i = 0; i < n; i++) {
    const m = minions[i];
    const x0 = i * segW;
    const alive = m.alive;
    const pct = alive ? Math.max(0, m.hp) / MINION_HP_MAX : 0;
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(x0, MINION_BAR_Y0, segW, MINION_BAR_H);
    if (alive) {
      ctx.fillStyle = MINION_COLOR;
      ctx.fillRect(x0, MINION_BAR_Y0, segW * pct, MINION_BAR_H);
    }
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x0 + 0.5, MINION_BAR_Y0 + 0.5, segW - 1, MINION_BAR_H - 1);
    ctx.fillStyle = alive ? '#111' : 'rgba(0,0,0,0.35)';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(alive ? ('#' + m.id + ': ' + Math.max(0, Math.round(m.hp)).toLocaleString('de-DE')) : ('#' + m.id + ': X'), x0 + segW / 2, MINION_BAR_Y0 + MINION_BAR_H / 2);
  }
}
function drawBall(ball, r, color, label) {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
  if (label) {
    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + Math.round(r * 0.85) + 'px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, ball.x, ball.y + 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4'; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#222'; ctx.font = '900 16px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const aliveCount = minions.filter(m => m.alive).length;
  ctx.fillText('FIBONACCI BOSS (' + Math.max(0, bossHp).toLocaleString('de-DE') + ')  vs  ' + aliveCount + ' FACTORIAL MINIONS', W / 2, LABEL_H / 2);

  drawArenaBg();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, ARENA_Y0, W, ARENA_H); ctx.clip();

  for (const m of minions) {
    if (!m.alive) continue;
    drawBall(m, m.r, MINION_COLOR, String(m.id));
    ctx.fillStyle = '#111'; ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(Math.max(0, Math.round(m.hp)).toLocaleString('de-DE'), m.x, m.y - m.r - 6);
  }
  if (bossHp > 0) drawBall(boss, boss.r, BOSS_COLOR, '');

  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = p.color; ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawBossBar();
  drawMinionBars();
  drawChecker(CHECKER_Y0, CHECKER_Y1);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, ARENA_Y0, W, ARENA_H);
    ctx.fillStyle = '#fff'; ctx.font = '900 26px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(winner === 'boss' ? 'BOSS WINS' : 'SWARM WINS', W / 2, ARENA_Y0 + ARENA_H / 2);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
